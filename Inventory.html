  .f-row {

    margin-bottom: 9px;

    color: #cbd5e1;

  /* MOBILE APP OPTIMIZATION (PWA) */
  @media (max-width: 768px) {
    body {
      height: auto;
      min-height: 100vh;
      overflow-y: auto;
      -webkit-font-smoothing: antialiased;
    }
    .top-header {
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
    }
    .brand-11 {
      gap: 8px;
    }
    .brand-11-text .b-title {
      font-size:16.32px;
    }
    .company-title h1 {
      font-size:13.26px;
    }
    .top-right-controls {
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px;
      width: 100%;
    }
    .top-right-controls button, .top-right-controls select {
      padding: 4px 6px;
      font-size:10.71px;
    }
    .top-menu {

    }
    .menu-btn {
      flex-shrink: 0;

      display: none;

      white-space: nowrap;
      font-size:11.22px;
      padding: 5px 8px;

    .work-stage {

      overflow: visible;
      height: auto;
    }
    div[style*="repeat(6,1fr)"], .grid-4, .grid-3 {
      grid-template-columns: repeat(2, 1fr) !important;
      gap: 6px !important;
    }
    .grid-2 {
      grid-template-columns: 1fr !important;
      gap: 6px !important;
    }
    .metric-card {
      padding: 8px 10px;
    }
    .metric-card .val-big {
      font-size:15.3px;
    }
    .card {
      padding: 8px;
      overflow-x: auto;
    }
    table {
      min-width: 520px;
      font-size:11.22px;
    }
    .status-footer {
      flex-direction: column;
      align-items: center;
      gap: 2px;
      text-align: center;
      padding: 6px;
    }
    .modal-win {
      width: 95vw;
      padding: 10px;
    }
  }

  @media print {

    }
    #printableSheet, #printableSheet * {

      margin: 0 !important;
      box-shadow: none !important;
      border: 1px solid #cbd5e1 !important;

// The same key protects Master, FY transaction files, automatic backups and manual backups.
const INVENTORY_ADMIN_PASSWORD = atob('U3JpcmFtQDE5MDE=');
let inventoryEncryptionPassword = INVENTORY_ADMIN_PASSWORD;
const INVENTORY_SECURE_MARKER = 'SRIRAM_GEMS_ENCRYPTED_AES256';
const toB64 = bytes => { const data=new Uint8Array(bytes); let binary=''; for(let i=0;i<data.length;i+=0x8000) binary+=String.fromCharCode(...data.subarray(i,i+0x8000)); return btoa(binary); };

function isEncryptedInventoryPayload(rawText) {
  try { const obj=JSON.parse(rawText); return !!(obj && obj._secure===INVENTORY_SECURE_MARKER && obj.ciphertext); }
  catch (_) { return /SRIRAM_GEMS_ENCRYPTED_AES256/.test(String(rawText)); }

async function encryptDataString(plainText, password=inventoryEncryptionPassword) {
  if (!password) throw new Error('Inventory password is not set. Reconnect the inventory folder.');
  if (!window.crypto || !window.crypto.subtle) throw new Error('Web Crypto is unavailable. Open this ERP in a secure Chrome/Edge context.');
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),{name:'PBKDF2'},false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt']);
  const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(plainText));
  return JSON.stringify({_secure:INVENTORY_SECURE_MARKER,version:1,algorithm:'AES-256-GCM',kdf:'PBKDF2-SHA256',iterations:100000,salt:toB64(salt),iv:toB64(iv),ciphertext:toB64(cipher)});
}
async function decryptDataString(rawText, password=inventoryEncryptionPassword) {
  const text=String(rawText||'').trim();
  let parsed=null;
  try { parsed=JSON.parse(text); } catch (_) {}
  if (!parsed || parsed._secure!==INVENTORY_SECURE_MARKER || !parsed.ciphertext) {
    // Backward compatibility: permit an older unencrypted JSON file only.
    if (parsed && typeof parsed==='object') return text;
    // Some older protected backups were HTML wrappers around the encrypted JSON.
    const match=text.match(/\{\s*"_secure"\s*:\s*"SRIRAM_GEMS_ENCRYPTED_AES256"[\s\S]*?\}/);
    if (match) return decryptDataString(match[0],password);
    throw new Error('Unsupported backup format. Select an encrypted Sriram backup or a JSON file.');
  }
  if (!password) throw new Error('Inventory password is required to decrypt this file.');
  const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),{name:'PBKDF2'},false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:fromB64(parsed.salt),iterations:Number(parsed.iterations)||100000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(parsed.iv)},key,fromB64(parsed.ciphertext));
  return new TextDecoder().decode(plain);
}

function formatDdMmYy(dateStr) {
  if (!dateStr) return '';
  const str = String(dateStr).trim();
  if (str.includes('-')) {
    const parts = str.split('-');
    if (parts.length === 3) {
      if (parts[0].length === 4) {
        // YYYY-MM-DD
        const y = parts[0].slice(-2);
        const m = parts[1].padStart(2, '0');
        const d = parts[2].padStart(2, '0');
        return `${d}-${m}-${y}`;
      } else if (parts[2].length === 4) {
        // DD-MM-YYYY
        const d = parts[0].padStart(2, '0');
        const m = parts[1].padStart(2, '0');
        const y = parts[2].slice(-2);
        return `${d}-${m}-${y}`;
      }
    }
  }
  try {
    const d = new Date(dateStr);
    if (!isNaN(d.getTime())) {
      const day = String(d.getDate()).padStart(2, '0');
      const mo = String(d.getMonth() + 1).padStart(2, '0');
      const yr = String(d.getFullYear()).slice(-2);
      return `${day}-${mo}-${yr}`;
    }
  } catch (e) {}
  return dateStr;
}

function getFyPrefix(dateStr) {
  let yr, mo;
  if (dateStr && String(dateStr).includes('-')) {
    const parts = String(dateStr).split('-');
    yr = parseInt(parts[0], 10);
    mo = parseInt(parts[1], 10);
  } else {
    const d = new Date();
    yr = d.getFullYear();
    mo = d.getMonth() + 1;
  }
  const startYr = mo >= 4 ? yr : yr - 1;
  const endYr = startYr + 1;
  return String(startYr).slice(-2) + String(endYr).slice(-2);
}

function generateFyVoucherNo(category, dateStr) {
  const fy = getFyPrefix(dateStr);
  let prefix = '';
  let list = [];
  if (category.startsWith('custom_')) {
    const code = category.replace('custom_', '');
    prefix = `${code}-`;
    const sObj = (db.customSeries || []).find(s => s.code === code);
    const base = sObj ? sObj.baseType : '';
    if (base === 'Orders') {
      list = (db.orders || []).filter(o => (o.id || '').startsWith(prefix) && getFyPrefix(o.date) === fy);
    } else {
      list = (db.vouchers || []).filter(v => (v.id || '').startsWith(prefix) && getFyPrefix(v.date) === fy);
    }
  } else if (category === 'OH_Orders' || category === 'OH') {
    prefix = 'OH-';
    list = (db.orders || []).filter(o => (o.id || '').startsWith('OH-') && getFyPrefix(o.date) === fy);
  } else if (category === 'DH_Delivery' || category === 'DH') {
    prefix = 'DH-';
    list = (db.vouchers || []).filter(v => v.vType === 'Delivery' && (v.id || '').startsWith('DH-') && getFyPrefix(v.date) === fy);
  } else if (category === 'RH_Receipt' || category === 'RH') {
    prefix = 'RH-';
    list = (db.vouchers || []).filter(v => v.vType === 'Receipt' && (v.id || '').startsWith('RH-') && getFyPrefix(v.date) === fy);
  } else if (category === 'PH_Payment' || category === 'PH') {
    prefix = 'PH-';
    list = (db.vouchers || []).filter(v => v.vType === 'Payment' && (v.id || '').startsWith('PH-') && getFyPrefix(v.date) === fy);
  } else if (category === 'Orders') {
    prefix = 'OR-';
    list = (db.orders || []).filter(o => !(o.id || '').startsWith('OH-') && getFyPrefix(o.date) === fy);
  } else if (category === 'Delivery') {
    prefix = 'DEL-';
    list = (db.vouchers || []).filter(v => v.vType === 'Delivery' && !(v.id || '').startsWith('DH-') && getFyPrefix(v.date) === fy);
  } else if (category === 'Receipt') {
    prefix = 'RC-';
    list = (db.vouchers || []).filter(v => v.vType === 'Receipt' && !(v.id || '').startsWith('RH-') && getFyPrefix(v.date) === fy);
  } else if (category === 'Payment') {
    prefix = 'PY-';
    list = (db.vouchers || []).filter(v => v.vType === 'Payment' && !(v.id || '').startsWith('PH-') && getFyPrefix(v.date) === fy);
  } else if (category === 'Contra') {
    prefix = 'CT-';
    list = (db.vouchers || []).filter(v => v.vType === 'Contra' && getFyPrefix(v.date) === fy);
  } else if (category === 'StockGeneral') {
    prefix = 'SJ-';
    list = (db.vouchers || []).filter(v => v.vType === 'StockGeneral' && getFyPrefix(v.date) === fy);
  } else if (category === 'Salary') {
    prefix = 'SV-';
    list = (db.vouchers || []).filter(v => v.vType === 'Salary' && getFyPrefix(v.date) === fy);
  } else if (category === 'Unfix') {
    prefix = 'UNFX-';
    list = (db.unfixInvoices || []).filter(u => getFyPrefix(u.date) === fy);
  }
  let maxSeq = 0;
  const fullPrefix = `${prefix}${fy}-`;
  list.forEach(item => {
    if (item.id && String(item.id).startsWith(fullPrefix)) {
      const parts = String(item.id).split('-');
      const lastPart = parseInt(parts[parts.length - 1], 10);
      if (!isNaN(lastPart) && lastPart > maxSeq) maxSeq = lastPart;
    }
  });
  const nextSeq = String(maxSeq + 1).padStart(3, '0');
  return `${fullPrefix}${nextSeq}`;
}
function generateNextLedgerId() {
  let maxN = 0;
  db.ledgers.forEach(l => {
    const m = String(l.id || '').match(/(\d+)$/);
    if (m) maxN = Math.max(maxN, parseInt(m[1], 10));
  });
  return 'L' + String(maxN + 1).padStart(3, '0');
}

// Persist the selected application/data folder handle in IndexedDB.
// Browser security still requires a first-time user folder selection and may
// require renewed permission after browser/device policy changes.
const HPJ_FOLDER_DB_NAME = 'hpj-inventory-folder-access';
const HPJ_FOLDER_STORE = 'handles';
function hpjOpenFolderHandleStore() {
  return new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) return reject(new Error('IndexedDB is unavailable.'));
    const req = indexedDB.open(HPJ_FOLDER_DB_NAME, 1);
    req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains(HPJ_FOLDER_STORE)) req.result.createObjectStore(HPJ_FOLDER_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error('Could not open folder handle storage.'));
  });
}
async function hpjStoreFolderHandle(handle) {
  const database = await hpjOpenFolderHandleStore();
  try { await new Promise((resolve, reject) => { const tx=database.transaction(HPJ_FOLDER_STORE,'readwrite'); tx.objectStore(HPJ_FOLDER_STORE).put(handle,'inventoryFolder'); tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error); }); }

async function makeDailyRollingBackup(){

  const todayName='SRIRAM_AUTO_BACKUP_'+day+'.db';
  // Exactly one rolling backup per calendar day. Rewrite it after each successful save
  // so it always contains the latest committed Master + all FY databases for that day.
  const snapshot=await writeBackupSnapshot();
  try {
    const handle=await connectedDirectoryHandle.getFileHandle(todayName,{create:true});
    await writeAndVerifyBackup(handle,snapshot);
  } finally { snapshot.close(); }
  // Retain today and the previous 14 calendar days (15 daily snapshots total).
  const todayMidnight=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  const cutoff=new Date(todayMidnight); cutoff.setDate(cutoff.getDate()-14);
  for await(const [name] of connectedDirectoryHandle.entries()) {
    const backupDay=parseBackupDay(name);
    if(backupDay!==null && backupDay<cutoff.getTime()) {
      try { await connectedDirectoryHandle.removeEntry(name); }
      catch(e) { console.warn('Rolling backup prune failed',name,e); }
    }
  }
  lastDailyBackupDate=day;
  return true;
}

function erpCashLedgerBalance(ledger){
  let bal=Number(ledger.openBal||0);
  const same=(v)=>v.cashLedgerId===ledger.id || (!v.cashLedgerId && (v.cashLedger===ledger.name || v.cashLedgerName===ledger.name || (ledger.name==='Cash in Hand' && !v.cashLedger)));
  for(const v of getApprovedVouchers()){
    const amt=Number(v.cashPaid||v.cashAmount||0);
    if(v.vType==='Delivery'&&same(v)){ if(v.subType==='Sale')bal+=Number(v.cashPaid||0); else if(v.subType==='Purchase')bal-=Number(v.cashPaid||0); }
    else if(v.vType==='Receipt'&&same(v)) bal+=Number(v.cashAmount||0);
    else if(v.vType==='Payment'&&same(v)) bal-=Number(v.cashAmount||0);
    else if(v.vType==='Contra'){
      if(v.contraType==='Cash to Cash'){
        if(v.fromLedgerId===ledger.id || v.fromAcc===ledger.name)bal-=Number(v.amount||0);
        if(v.toLedgerId===ledger.id || v.toAcc===ledger.name)bal+=Number(v.amount||0);
      } else if(v.contraType==='Bank to Cash'&&(v.toLedgerId===ledger.id||v.toAcc===ledger.name))bal+=Number(v.amount||0);
      else if(v.contraType==='Cash to Bank'&&(v.fromLedgerId===ledger.id||v.fromAcc===ledger.name))bal-=Number(v.amount||0);
    } else if(v.vType==='Salary'&&(v.payLedgerId===ledger.id || v.payAccount===ledger.name))bal-=Number(v.amount||0);
  }
  return bal;
}

  <tbody>${rows.map(x=>{const l=x.ledger;let ins=0,outs=0;getApprovedVouchers().forEach(v=>{const linked=v.cashLedgerId===l.id||(!v.cashLedgerId&&(v.cashLedger===l.name||(!v.cashLedger&&l.name==='Cash in Hand')));if(v.vType==='Receipt'&&linked)ins+=Number(v.cashAmount||0);if(v.vType==='Payment'&&linked)outs+=Number(v.cashAmount||0);if(v.vType==='Delivery'&&linked){if(v.subType==='Sale')ins+=Number(v.cashPaid||0);if(v.subType==='Purchase')outs+=Number(v.cashPaid||0);}if(v.vType==='Contra'){if(v.contraType==='Cash to Cash'){if(v.toLedgerId===l.id||v.toAcc===l.name)ins+=Number(v.amount||0);if(v.fromLedgerId===l.id||v.fromAcc===l.name)outs+=Number(v.amount||0);}else if(v.contraType==='Bank to Cash'&&(v.toLedgerId===l.id||v.toAcc===l.name))ins+=Number(v.amount||0);else if(v.contraType==='Cash to Bank'&&(v.fromLedgerId===l.id||v.fromAcc===l.name))outs+=Number(v.amount||0);}if(v.vType==='Salary'&&(v.payLedgerId===l.id||v.payAccount===l.name))outs+=Number(v.amount||0);});return `<tr><td><b>${l.name}</b></td><td class="r">₹ ${erpDisplayFmt(Number(l.openBal||0),'money')}</td><td class="r">₹ ${erpDisplayFmt(ins,'money')}</td><td class="r">₹ ${erpDisplayFmt(outs,'money')}</td><td class="r"><b>₹ ${erpDisplayFmt(x.balance,'money')}</b></td></tr>`}).join('')||'<tr><td colspan="5">No Cash-in-Hand ledgers found</td></tr>'}
  <tr><th>Total</th><th class="r">₹ ${erpDisplayFmt(rows.reduce((a,x)=>a+Number(x.ledger.openBal||0),0),'money')}</th><th colspan="2"></th><th class="r">₹ ${erpDisplayFmt(total,'money')}</th></tr></tbody></table></div>`;
  document.getElementById('modalWin').innerHTML=html;document.getElementById('modalBg').style.display='flex';
}

function getCashBal() { return getCashLedgerBals().reduce((sum,x)=>sum+x.balance,0); }
function getBankBals() {
  return db.ledgers.filter(l => ['Bank Account','Bank Accounts','Bank Loan','Secured Loans'].includes(l.group) || ['Bank','BankLoan'].includes(erpNatureForGroup(l.group)) || ['Bank','BankLoan'].includes(l.nature)).map(b => {
    let bal = Number(b.openBal || 0);
    for (let v of getApprovedVouchers()) {
      if (v.bankSplits) {
        for (let s of v.bankSplits) {
          if (s.bank === b.name) {
            if (v.vType === 'Delivery' && v.subType === 'Sale') bal += Number(s.amount || 
0);
            if (v.vType === 'Delivery' && v.subType === 'Purchase') bal -= Number(s.amount 
|| 0);
            if (v.vType === 'Receipt') bal += Number(s.amount || 0);
            if (v.vType === 'Payment') bal -= Number(s.amount || 0);
          }
        }
      }
      if (v.vType === 'Contra') {
        if (v.toAcc === b.name) bal += Number(v.amount || 0);
        if (v.fromAcc === b.name) bal -= Number(v.amount || 0);
      }
      if (v.vType === 'Salary' && v.payAccount === b.name) {
        bal -= Number(v.amount || 0);
      }
    }
    return { ...b, balance: bal };
  });
}
function getDeliveredQtyForPartyProduct(party, subType, product, excludeVoucherId = null) {
  let delivered = 0;
  for (const v of getApprovedVouchers()) {
    // During Delivery Alter, ignore the voucher being edited so its own quantity
    // becomes available for re-allocation instead of being counted as delivered.
    if (excludeVoucherId && v.id === excludeVoucherId && v.vType === 'Delivery') continue;
    if (v.vType !== 'Delivery' || v.subType !== subType || v.party !== party) continue;
    for (const it of (v.items || [])) {
      if (it.product !== product) continue;
      // Explicit allocations are accounted against their own order below.
      if (!Array.isArray(it.orderAllocations) || it.orderAllocations.length === 0) {
        delivered += Number(it.qty || 0);
      }
    }
  }
  return delivered;
}
function getPendingOrderBatches(party, subType, product, excludeVoucherId = null) {
  if (!party || !product) return [];
  let legacyDelivered = getDeliveredQtyForPartyProduct(party, subType, product, excludeVoucherId);
  const batches = [];
  for (const o of getApprovedOrders()) {
    if (o.type !== subType || o.party !== party) continue;
    (o.items || []).forEach((it, index) => {
      if (it.product !== product) return;
      const orderId = o.id;
      const lineKey = it.orderLineKey || `${o.id}::${index}`;
      const orderedQty = Number(it.qty || 0);
      let explicitlyDelivered = 0;
      for (const v of getApprovedVouchers()) {
        if (excludeVoucherId && v.id === excludeVoucherId && v.vType === 'Delivery') continue;
        if (v.vType !== 'Delivery' || v.subType !== subType || v.party !== party) continue;
        for (const deliveredItem of (v.items || [])) {
          for (const a of (deliveredItem.orderAllocations || [])) {
            if (a.orderId === orderId && (a.orderLineKey === lineKey || (!a.orderLineKey && a.product === product))) {
              explicitlyDelivered += Number(a.qty || 0);
            }
          }
        }
      }
      const legacyUsed = Math.min(Math.max(0, orderedQty - explicitlyDelivered), legacyDelivered);
      legacyDelivered -= legacyUsed;
      const pendingQty = Math.max(0, orderedQty - explicitlyDelivered - legacyUsed);
      if (pendingQty > 0) {
        batches.push({ orderId, orderLineKey: lineKey, date: o.date, pendingQty,
          orderedQty, deliveredQty: orderedQty - pendingQty, product,
          unit: it.unit || (db.products || []).find(p => p.name === product)?.unit || '',
          rate: Number(it.rate || 0), value: pendingQty * Number(it.rate || 0),
          sourceUnfixId: o.sourceUnfixId || null });
      }
    });
  }
  return batches;
}
function getProductPendingOrderRows(product, parties = null) {
  const partyList = parties || (db.ledgers || []).filter(l =>
    ['Debtors','Creditors','Sundry Debtors','Sundry Creditors'].includes(l.group) ||
    ['Debtor','Creditor'].includes(erpNatureForGroup(l.group)));
  const rows = [];
  for (const party of partyList) {
    for (const type of ['Sale', 'Purchase']) {
      getPendingOrderBatches(party.name, type, product).forEach(batch =>
        rows.push({ ...batch, type, displayType: type, party: party.name }));
    }
  }
  // The unreserved balance of an approved Unfix invoice is also an outstanding
  // commitment. Quantities already converted into orders are excluded here.
  for (const inv of (db.unfixInvoices || [])) {
    if ((inv.status || 'Approved') !== 'Approved' || inv.product !== product) continue;
    const fixedQty = getUnfixReservedOrderQty(inv);
    const remainingQty = Math.max(0, Number(inv.qty || 0) - fixedQty);
    if (!remainingQty) continue;
    rows.push({
      orderId: inv.id, orderLineKey: `UF::${inv.id}`, date: inv.date,
      pendingQty: remainingQty, orderedQty: Number(inv.qty || 0),
      deliveredQty: fixedQty, product, unit: inv.unit || (db.products || []).find(p => p.name === product)?.unit || '',
      rate: Number(inv.provisionalRate || 0), value: remainingQty * Number(inv.provisionalRate || 0),
      sourceUnfixId: inv.id, type: inv.type, displayType: inv.type === 'Sale' ? 'UF Sale' : 'UF Purchase', party: inv.party
    });
  }
  return rows;
}

function getProductValuation(p, closingQty) {
  const method = (db.settings && ['S','P','C','F'].includes(db.settings.productMethod)) ? db.settings.productMethod : 'P';
  const openingQty = Math.max(0, Number(p.openQty || 0));
  const openingValue = Number(p.value ?? (openingQty * Number(p.rate || 0)));
  let purchaseQty = openingQty, purchaseValue = openingValue;
  let saleQty = 0, saleValue = 0;
  const events = [];
  let seq = 0;
  const addEvent = (date, kind, qty, rate) => {
    const q = Math.max(0, Number(qty || 0));
    if (!q) return;
    events.push({ date: date || '9999-12-31', seq: seq++, kind, qty: q, rate: Number(rate || 0) });
  };
  // Opening stock is the oldest FIFO batch.
  if (openingQty > 0) addEvent('0000-01-01', 'in', openingQty, openingValue / openingQty);
  for (const v of getApprovedVouchers()) {
    if (v.vType === 'Delivery') {
      for (const it of (v.items || [])) {
        if (it.product !== p.name) continue;
        const q = Number(it.qty || 0), r = Number(it.rate || 0);
        if (v.subType === 'Purchase') {
          purchaseQty += q; purchaseValue += q * r;
          addEvent(v.date, 'in', q, r);
        } else if (v.subType === 'Sale') {
          saleQty += q; saleValue += q * r;
          addEvent(v.date, 'out', q, r);
        }
      }
    } else if (v.vType === 'StockGeneral') {
      const debit = Array.isArray(v.debitItems) ? v.debitItems : (v.debitProduct ? [{product:v.debitProduct,qty:v.debitQty,rate:v.debitRate}] : []);
      const credit = Array.isArray(v.creditItems) ? v.creditItems : (v.creditProduct ? [{product:v.creditProduct,qty:v.creditQty,rate:v.creditRate}] : []);
      for (const it of credit) if (it.product === p.name) addEvent(v.date, 'out', it.qty, it.rate);
      for (const it of debit) if (it.product === p.name) {
        const q = Number(it.qty || 0), r = Number(it.rate || 0);
        purchaseQty += q; purchaseValue += q * r;
        addEvent(v.date, 'in', q, r);
      }
    }
  }
  for (const u of (db.unfixInvoices || [])) {
    if ((u.status || 'Approved') !== 'Approved' || u.product !== p.name) continue;
    const q = Number(u.qty || 0), r = Number(u.provisionalRate || 0);
    if (u.type === 'Purchase') {
      purchaseQty += q; purchaseValue += q * r;
      addEvent(u.date, 'in', q, r);
    } else if (u.type === 'Sale') {
      saleQty += q; saleValue += q * r;
      addEvent(u.date, 'out', q, r);
    }
  }
  const purchaseAvg = purchaseQty > 0 ? purchaseValue / purchaseQty : Number(p.rate || 0);
  const saleAvg = saleQty > 0 ? saleValue / saleQty : purchaseAvg;
  const combinedQty = purchaseQty + saleQty;
  const combinedAvg = combinedQty > 0 ? (purchaseValue + saleValue) / combinedQty : purchaseAvg;

  // FIFO: issue quantities against the oldest available batch and value the remaining layers.
  events.sort((a,b) => String(a.date).localeCompare(String(b.date)) || a.seq - b.seq);
  const layers = [];
  for (const ev of events) {
    if (ev.kind === 'in') {
      layers.push({ qty: ev.qty, rate: ev.rate });
    } else {
      let remaining = ev.qty;
      for (let i=0; i<layers.length && remaining>0; i++) {
        const take = Math.min(layers[i].qty, remaining);
        layers[i].qty -= take; remaining -= take;
      }
      for (let i=layers.length-1; i>=0; i--) if (layers[i].qty <= 0.0000001) layers.splice(i,1);
    }
  }
  let fifoQty = layers.reduce((a,b)=>a+b.qty,0);
  let fifoValue = layers.reduce((a,b)=>a+b.qty*b.rate,0);
  // Reconcile legacy/imported stock movements that do not have matching FIFO batch detail.
  const targetQty = Number(closingQty || 0);
  if (fifoQty > targetQty) {
    let excess = fifoQty - targetQty;
    for (let i=0; i<layers.length && excess>0; i++) {
      const take = Math.min(layers[i].qty, excess);
      layers[i].qty -= take; excess -= take;
    }
    for (let i=layers.length-1; i>=0; i--) if (layers[i].qty <= 0.0000001) layers.splice(i,1);
    fifoQty = layers.reduce((a,b)=>a+b.qty,0);
    fifoValue = layers.reduce((a,b)=>a+b.qty*b.rate,0);
  } else if (targetQty > fifoQty) {
    const missing = targetQty - fifoQty;
    layers.push({ qty: missing, rate: Number(p.rate || purchaseAvg || 0) });
    fifoQty = targetQty;
    fifoValue += missing * Number(p.rate || purchaseAvg || 0);
  }
  const fifoAvg = fifoQty > 0 ? fifoValue / fifoQty : Number(p.rate || purchaseAvg || 0);
  let avgRate = purchaseAvg;
  if (method === 'S') avgRate = saleAvg;
  else if (method === 'C') avgRate = combinedAvg;
  else if (method === 'F') avgRate = fifoAvg;
  if (!Number.isFinite(avgRate)) avgRate = Number(p.rate || 0);
  const avgValue = method === 'F' ? (targetQty < 0 ? targetQty * Number(p.rate || 0) : fifoValue) : targetQty * avgRate;
  return { method, avgRate: Math.round(avgRate*100)/100, avgValue: Math.round(avgValue*100)/100,
    rates: { S: Math.round(saleAvg*100)/100, P: Math.round(purchaseAvg*100)/100,
      C: Math.round(combinedAvg*100)/100, F: Math.round(fifoAvg*100)/100 },
    fifoLayers: layers.filter(x=>x.qty>0).map(x=>({qty:Math.round(x.qty*10000)/10000,rate:Math.round(x.rate*100)/100})) };
}

function getProductStocks() {
  return db.products.map(p => {
    let qty = Number(p.openQty || 0);
    let totalInwardQty = Number(p.openQty || 0);
    let totalInwardValue = Number(p.value || (p.openQty * p.rate));
    for (let v of getApprovedVouchers()) {
      if (v.vType === 'Delivery') {
        for (let it of v.items) {
          if (it.product === p.name) {
            if (v.subType === 'Sale') qty -= Number(it.qty || 0);
            if (v.subType === 'Purchase') {
              qty += Number(it.qty || 0);
              totalInwardQty += Number(it.qty || 0);
              totalInwardValue += Number(it.qty || 0) * Number(it.rate || 0);
            }
          }
        }
      } else if (v.vType === 'StockGeneral') {
        if (v.debitItems) {
          v.debitItems.forEach(di => {
            if (di.product === p.name) {
              qty += Number(di.qty || 0);
              totalInwardQty += Number(di.qty || 0);
              totalInwardValue += Number(di.qty || 0) * Number(di.rate || 0);
            }
          });
        } else if (v.debitProduct === p.name) {
          qty += Number(v.debitQty || 0);
          totalInwardQty += Number(v.debitQty || 0);
          totalInwardValue += Number(v.debitQty || 0) * Number(v.debitRate || 0);
        }
        if (v.creditItems) {
          v.creditItems.forEach(ci => { if (ci.product === p.name) qty -= Number(ci.qty || 
0); });
        } else if (v.creditProduct === p.name) {
          qty -= Number(v.creditQty || 0);
        }
      }
    }
    // Effect of Unfix Invoices on physical product stock
    (db.unfixInvoices || []).forEach(u => {
      if ((u.status || 'Approved') === 'Approved' && u.product === p.name) {
        const uQty = Number(u.qty || 0);
        if (u.type === 'Sale') {
          qty -= uQty; // Unfix sale reduces physical stock
        } else if (u.type === 'Purchase') {
          qty += uQty; // Unfix purchase increases physical stock
          totalInwardQty += uQty;
          totalInwardValue += uQty * Number(u.provisionalRate || 0);
        }
      }
    });
    const valuation = getProductValuation(p, qty);
    const avgRate = valuation.avgRate;
    const avgValue = valuation.avgValue;
    let parties = db.ledgers.filter(l => ['Debtors','Creditors','Sundry Debtors','Sundry Creditors'].includes(l.group) || ['Debtor','Creditor'].includes(erpNatureForGroup(l.group)));
    let pendingSale = 0, pendingPur = 0;
    for (let py of parties) {
      getPendingOrderBatches(py.name, 'Sale', p.name).forEach(b => pendingSale += 
b.pendingQty);
      getPendingOrderBatches(py.name, 'Purchase', p.name).forEach(b => pendingPur += 
b.pendingQty);
    }
    const orderTracking = getProductPendingOrderRows(p.name, parties);
    // Keep the dashboard's Net Pending quantities consistent with its detailed rows.
    pendingSale += orderTracking.filter(r => r.type === 'Sale' && r.displayType === 'UF Sale').reduce((sum, r) => sum + Number(r.pendingQty || 0), 0);
    pendingPur += orderTracking.filter(r => r.type === 'Purchase' && r.displayType === 'UF Purchase').reduce((sum, r) => sum + Number(r.pendingQty || 0), 0);
    return { ...p, stockQty: qty, pendingSale, pendingPur, orderTracking,
      pendingOrderQty: pendingSale + pendingPur,
      avgRate, avgRateMethod: valuation.method, avgRates: valuation.rates, fifoLayers: valuation.fifoLayers,
      avgValue, closingValue: avgValue };
  });
}
function getPartyAdvance(partyName) {
  if (!partyName) return 0;
  let adv = 0;
  for (let v of getApprovedVouchers()) {
    if (v.party === partyName) {
      if ((v.vType === 'Receipt' || v.vType === 'Payment') && v.refType === 'Advance') {
        adv += Number(v.amount || 0);
      }
      if (v.vType === 'Delivery' && Number(v.advanceAdjusted || 0) > 0) {
        adv -= Number(v.advanceAdjusted || 0);
      }
    }
  }
  return Math.max(0, adv);
}
function getPartyOpeningSignedBalance(p) {
  const partyNature = erpNatureForGroup(p?.group);
  return (partyNature === 'Debtor' || p?.group === 'Debtors' || p?.group === 'Sundry Debtors')
    ? Number(p?.openBal || 0)
    : -Number(p?.openBal || 0);
}
function getPartyBals() {
  return db.ledgers.filter(l => ['Debtors','Creditors','Sundry Debtors','Sundry Creditors'].includes(l.group) || ['Debtor','Creditor'].includes(erpNatureForGroup(l.group))).map(p => 
{
    let bal = getPartyOpeningSignedBalance(p);
    for (let v of getApprovedVouchers()) {
      if (v.party === p.name) {
        if (v.vType === 'Delivery' && v.subType === 'Sale') {
          let paid = Number(v.cashPaid || 0) + (v.bankSplits || []).reduce((s, b) => s + 
Number(b.amount || 0), 0);
          bal += (Number(v.totalAmount || 0) - paid);
        } else if (v.vType === 'Delivery' && v.subType === 'Purchase') {
          let paid = Number(v.cashPaid || 0) + (v.bankSplits || []).reduce((s, b) => s + 
Number(b.amount || 0), 0);
          bal -= (Number(v.totalAmount || 0) - paid);
        } else if (v.vType === 'Receipt') {
          bal -= Number(v.amount || 0);
        } else if (v.vType === 'Payment') {
          bal += Number(v.amount || 0);
        }
      }
    }
    const orderTracking = [];
    let outstandingOrderValue = 0;
    for (const type of ['Sale', 'Purchase']) {
      for (const pr of (db.products || [])) {
        for (const batch of getPendingOrderBatches(p.name, type, pr.name)) {
          const value = Number(batch.pendingQty || 0) * Number(batch.rate || 0);
          outstandingOrderValue += (type === 'Sale' ? value : -value);
          orderTracking.push({ ...batch, type, party: p.name, outstandingValue: value });
        }
      }
    }
    // Keep unposted order commitments separate; they are not ledger closing balance.
    return { ...p, netBal: bal, availAdvance: getPartyAdvance(p.name),
      orderTracking, pendingOrderValue: outstandingOrderValue };
  });
}

let isAppLoggedIn = false;

// SQLite file handles are declared in the storage layer above.
function formatDdMmmYyyy(dateStr) {
  const d = dateStr ? new Date(dateStr) : new Date();
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const dd = String(d.getDate()).padStart(2, '0');
  const mmm = months[d.getMonth()];
  const yyyy = d.getFullYear();
  return `${dd}-${mmm}-${yyyy}`;
}

function getAvailableFinancialYears() {
  const d = new Date();
  const year = d.getFullYear(); // e.g. 2026
  const month = d.getMonth(); // 0 to 11 (March is index 2, April is index 3)
  const currentStartYear = month >= 3 ? year : (year - 1);
  const fys = [];
  for (let y = currentStartYear - 1; y <= currentStartYear + 1; y++) {
    const nextY = String(y + 1).slice(-2);
    fys.push(`${y}-${nextY}`);
  }
  return { current: `${currentStartYear}-${String(currentStartYear + 1).slice(-2)}`, all: fys };
}

  erpEnsureLedgerHierarchy();

  if (loaded.users) db.users = loaded.users;
  if (loaded.audits) db.audits = loaded.audits;
  if (loaded.settings && typeof loaded.settings === 'object') db.settings = { ...(db.settings || {}), ...loaded.settings };
  db.settings = db.settings || {};
  if (!db.settings.businessName || db.settings.businessName === 'SRIRAM GEMS & JEWELLERY') db.settings.businessName = 'SRIRAM';
  if (!db.settings.businessAddress || db.settings.businessAddress === 'Temple Street, Kakinada - 533001') db.settings.businessAddress = 'KKD';
  db.settings.productMethod = ['S','P','C','F'].includes(db.settings.productMethod) ? db.settings.productMethod : 'P';

  if (activeUser) db.currentUser = activeUser;

  // just-loaded Master DB business profile rather than hard-coded defaults.

let sourceSyncInProgress = false;
async function syncSourceData(isManual = false) {
  if(sourceSyncInProgress){if(isManual)showAlert('Sync is already running. Please wait.');return false;}
  sourceSyncInProgress=true;const activeUser=db.currentUser;
  try{
    if(!connectedDirectoryHandle||!connectedMasterFileHandle)throw new Error('Connect the Master/FY database folder in Settings first.');
    const mf=await connectedMasterFileHandle.getFile();masterSqliteDb=await readDatabaseFile(mf,'MASTER');
    const merged=await loadMasterAndFY(currentFY);
    if(!Array.isArray(merged.products)||!Array.isArray(merged.ledgers))throw new Error('Selected Master database contains invalid Sriram ERP data.');
    applyLoadedData(merged,activeUser);validateInventoryStructure(db);validateCalculationSnapshot(db);
    sourceFileBaseline='SQLite:'+connectedMasterFileHandle.name+' + SRIRAM_FY_'+currentFY+'.db';dataFileVerified=true;dataFileConnectionError=false;
    lastSyncTime=new Date();const t=lastSyncTime.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});const label=document.getElementById('lastSyncLabel');if(label)label.textContent='Synced: '+t;updateFooterDataStatus('connected');
    const tag=document.activeElement?document.activeElement.tagName.toLowerCase():'';if(isManual||!['input','textarea','select'].includes(tag)){updateHeaderControls();updateLeftBottomStatusBox();if(isManual)openView(currentView,currentSub);else if(currentView==='dashboard')renderDashboard();}
    if(isManual)showAlert('Master and FY '+currentFY+' databases synced successfully. ('+t+')');return true;
  }catch(err){console.warn('SQLite sync failed:',err);dataFileVerified=false;dataFileConnectionError=true;updateFooterDataStatus('error');if(isManual)showAlert('Sync failed: '+err.message);return false;}
  finally{sourceSyncInProgress=false;}
}

async function connectInventoryFolder(createNew=false, suppliedDirectoryHandle=null, silent=false){
  const createdDuringConnect=[];
  try{
    if(!window.showDirectoryPicker && !suppliedDirectoryHandle)throw new Error('This browser does not support folder access. Use Chrome/Edge with File System Access API.');
    const dir=suppliedDirectoryHandle || await window.showDirectoryPicker({mode:'readwrite'});connectedDirectoryHandle=dir;
    try { await hpjStoreFolderHandle(dir); } catch(storeError) { console.warn('Folder handle could not be saved for auto-reconnect:',storeError); }
    if(createNew){
      const newMasterName=masterDatabaseFileName();
      try { await dir.getFileHandle(newMasterName); throw new Error(newMasterName+' already exists. Choose Connect Existing Data Folder or select an empty folder.'); }
      catch(e) { if(e && e.message && e.message.includes('already exists')) throw e; }
      for await(const [name] of dir.entries()) if(/^SRIRAM_FY_\d{4}-\d{2}\.db$/i.test(name)) throw new Error('This folder already contains FY database '+name+'. Choose Connect Existing Data Folder or an empty folder.');
      connectedMasterFileHandle=await dir.getFileHandle(newMasterName,{create:true});createdDuringConnect.push(newMasterName);
    } else {
      connectedMasterFileHandle=await findMasterDatabaseHandle(dir);
    }
    if(!connectedMasterFileHandle) throw new Error('No dated SRIRAM_MASTER_DD-MM-YY.db was found in this folder. Choose Create New Data Folder to initialize a blank inventory.');
    let mf=await connectedMasterFileHandle.getFile();
    if(mf.size>0) masterSqliteDb=await readDatabaseFile(mf,'MASTER');
    else {
      if(!createNew) throw new Error(connectedMasterFileHandle.name+' exists but is empty (0 bytes). Choose a new folder or remove the empty file first.');
      masterSqliteDb=await newMasterDatabase();
      const blank=splitDatabaseByFY(db).master;
      const cipher=await encryptDataString(JSON.stringify(blank));
      masterSqliteDb.run('INSERT INTO inventory_master VALUES(1,?,?)',[cipher,new Date().toISOString()]);
      await writeAndVerify(connectedMasterFileHandle,masterSqliteDb,'MASTER');
    }
    connectedFileHandle=connectedMasterFileHandle;
    // Create/load current FY file. No legacy JSON is imported: this is a clean blank-start profile.
    const fyFileName='SRIRAM_FY_'+currentFY+'.db';let fyExisted=true;try{await dir.getFileHandle(fyFileName);}catch(_){fyExisted=false;}connectedFYFileHandle=await dir.getFileHandle(fyFileName,{create:true});if(!fyExisted)createdDuringConnect.push(fyFileName);
    const ff=await connectedFYFileHandle.getFile();
    if(ff.size>0)fySqliteDb=await readDatabaseFile(ff,'FY');
    else{
      fySqliteDb=await newFYDatabase();const cipher=await encryptDataString(JSON.stringify(blankFYData()));
      fySqliteDb.run('INSERT INTO inventory_fy VALUES(1,?,?,?)',[currentFY,cipher,new Date().toISOString()]);
      await writeAndVerify(connectedFYFileHandle,fySqliteDb,'FY',currentFY);
    }
    sqliteDb=fySqliteDb;
    const merged=await loadMasterAndFY(currentFY);applyLoadedData(merged,db.currentUser);
    validateInventoryStructure(db);const connectTotals=validateCalculationSnapshot(db);
    // Validate every FY database in the selected folder before declaring the folder connected.
    const connectedFYEntries=[];
    for await(const [name,handle] of dir.entries()) if(/^SRIRAM_FY_\d{4}-\d{2}\.db$/i.test(name)){
      const f=await handle.getFile();if(f.size<=0)throw new Error(name+' is empty.');const d=await readDatabaseFile(f,'FY');
      try{const rows=d.exec('SELECT fy,payload FROM inventory_fy WHERE id=1');if(!rows.length||!rows[0].values.length)throw new Error(name+' has no FY record.');const [fy,payload]=rows[0].values[0];const data=JSON.parse(await decryptDataString(payload));if(fy!==name.replace(/^SRIRAM_FY_|\.db$/gi,''))throw new Error(name+' FY identity mismatch.');if(!Array.isArray(data.orders)||!Array.isArray(data.vouchers)||!Array.isArray(data.unfixInvoices))throw new Error(name+' transaction structure is invalid.');connectedFYEntries.push({fy,payload,data});}finally{d.close();}
    }
    const masterForAllFY=JSON.parse(await decryptDataString(sqlitePayload(masterSqliteDb,'SELECT payload FROM inventory_master WHERE id=1')));
    await validateAllFYCalculations(masterForAllFY,connectedFYEntries);
    const diskMaster=await connectedMasterFileHandle.getFile();const diskFY=await connectedFYFileHandle.getFile();
    const checkM=await readDatabaseFile(diskMaster,'MASTER');const checkF=await readDatabaseFile(diskFY,'FY');
    try{await readBackAndCompareMaster(checkM,db);await readBackAndCompareFY(checkF,db,currentFY);}finally{checkM.close();checkF.close();}
    connectedDatabaseFiles=[{name:connectedMasterFileHandle.name,kind:'Master Database',verified:true},...connectedFYEntries.map(x=>({name:'SRIRAM_FY_'+x.fy+'.db',kind:'Financial Year Database',verified:true}))];
    sourceFileBaseline='SQLite:'+connectedMasterFileHandle.name+' + SRIRAM_FY_'+currentFY+'.db';dataFileVerified=true;dataFileConnectionError=false;
    await makeDailyRollingBackup();updateDataFileStatusBadge();updateFooterDataStatus('connected');
    if(!silent) showAlert('Connected and verified: Master + FY '+currentFY+'. Database read-back and inventory calculation checks passed.');openView(currentView,currentSub);
  }catch(err){if(createNew&&connectedDirectoryHandle){for(const name of createdDuringConnect){try{await connectedDirectoryHandle.removeEntry(name);}catch(_){} }masterSqliteDb=null;fySqliteDb=null;sqliteDb=null;connectedMasterFileHandle=null;connectedFYFileHandle=null;connectedFileHandle=null;connectedDirectoryHandle=null;connectedDatabaseFiles=[];dataFileVerified=false;dataFileConnectionError=true;updateFooterDataStatus('error');}if(err.name!=='AbortError'){console.error(err);if(!silent)showAlert('Could not connect SQLite databases: '+err.message);}}
}

function updateFooterDataStatus(state) {
  const el = document.getElementById('footerSystemStatus');
  if (!el) return;
  const status = state || (dataFileConnectionError ? 'error' : (connectedFileHandle && dataFileVerified ? 'connected' : 'disconnected'));
  el.classList.remove('data-not-connected','data-connected','data-connection-error');
  const parent = el.closest('.footer-system');
  if (parent) parent.classList.remove('data-not-connected','data-connected','data-connection-error');
  const cls = status === 'connected' ? 'data-connected' : (status === 'error' ? 'data-connection-error' : 'data-not-connected');
  el.textContent = status === 'connected' ? 'Data Connected' : (status === 'error' ? 'Connection Error' : 'Data Not Connected');
  el.classList.add(cls); if (parent) parent.classList.add(cls);
}

function userHasMenuAccess(key, user = db.currentUser) {
  if (!user || user.role === 'Admin') return true;
  const target = (db.users || []).find(u => u.username === user.username) || user;
  // Existing staff accounts without a permission list retain their previous access.
  if (!Array.isArray(target.menuPermissions)) {
    const oldAllowed = new Set(['home','transaction','transaction.orders','transaction.delivery','transaction.receipt','transaction.payment','transaction.contra','transaction.unfix','insights','insights.productdash','insights.productledger','insights.partydash','insights.partyledger']);
    return oldAllowed.has(key);
  }
  const perms = new Set(target.menuPermissions);
  if (perms.has(key)) return true;
  // A selected parent grants all its child screens; a child is visible only if individually selected otherwise.
  const rawParent = key.split('.')[0];
  const parent = rawParent === 'master' ? 'masters' : rawParent;
  if (key.includes('.') && perms.has(parent)) return true;
  if (!key.includes('.')) { const prefix = key === 'masters' ? 'master.' : key + '.'; return [...perms].some(item => item.startsWith(prefix)); }
  return false;
}

window.addEventListener('keydown', function(e) {
  if (e.altKey && !e.ctrlKey && !e.metaKey) {
    const k = e.key.toLowerCase();
    const actions = {a:()=>syncSourceData(true),'0':()=>openView('dashboard'),'1':()=>openView('partydash'),'2':()=>openView('productdash'),v:()=>openView('reports'),m:()=>openView('master'),t:()=>openView('transaction'),u:()=>openView('unfix'),s:()=>openView('approvals')};
    if (actions[k]) { e.preventDefault(); actions[k](); return; }
  }
  const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
  const isTyping = ['input','textarea','select'].includes(activeTag);
  if (!isTyping && (e.key === 't' || e.key === 'T') && !e.ctrlKey && !e.altKey && !e.metaKey) { e.preventDefault(); openView('transaction'); return; }
  // Existing function-key shortcuts remain; the removed key is not mapped.
  if (['F1','F2','F3','F4','F5','F6','F7','F9'].includes(e.key)) {
    e.preventDefault();
    if (currentView === 'master') {
      const mMap = {F1:'units',F2:'stockgroup',F3:'product',F4:'ledger',F5:'createforms'};
      if (mMap[e.key]) openView('master',mMap[e.key]);
    } else {
      const tMap = {F1:'orders',F2:'delivery',F3:'receipt',F4:'payment',F5:'contra',F6:'stockgeneral',F7:'salary',F9:'self'};
      if (tMap[e.key]) openView('transaction',tMap[e.key]);
    }
  } else if (e.key === 'Escape') {
    if (document.getElementById('modalBg')?.style.display === 'flex') closeModal();
    else if (currentView !== 'dashboard') openView('dashboard');
  }
});

    const parent = window.__alterPopupParent;

    parent.insertBefore(node, next && next.parentNode === parent ? next : null);
    if (node.id && node.id.startsWith('v_form_pane_') && window.__voucherMode[node.id.replace('v_form_pane_', '')] === 'register') node.style.display = 'none';

oninput="calcCashAudit()" style="width:100px;padding:3px;"></td>
          <td class="r" id="ca_row_${d}">0</td>
        </tr>`).join('')}
      </tbody>
    </table>
    <div id="ca_warn_box" class="warn-red" style="margin-top:10px;">Net Audit Amount: 
&#8377; 0 | Difference: -&#8377; ${sysBal.toLocaleString('en-IN')} (Short)</div>
    <div style="margin-top:10px;display:flex;justify-content:flex-end;gap:8px;">
      <button class="btn btn-green" onclick="saveCashAudit()">Save</button>

    </div>
  `;
  document.getElementById('modalBg').style.display = 'flex';
}
function calcCashAudit() {
  const sys = Number(document.getElementById('ca_sys_val').dataset.val);
  let total = 0;
  document.querySelectorAll('.ca-denom').forEach(inp => {
    const d = Number(inp.dataset.d);
    const q = parseIndianNumber(inp.value || 0);
    document.getElementById('ca_row_' + d).textContent = (d * q).toLocaleString('en-IN');
    total += d * q;
  });
  const diff = total - sys;
  const wb = document.getElementById('ca_warn_box');
  wb.dataset.total = total;
  wb.dataset.diff = diff;
  if (diff === 0) {
    wb.className = 'warn-green';
    wb.innerHTML = `Net Audit Amount: &#8377; ${erpDisplayFmt(total,'money')} | Matched`;
  } else if (diff > 0) {
    wb.className = 'warn-red';
    wb.innerHTML = `Net Audit Amount: &#8377; ${erpDisplayFmt(total,'money')} | Excess: 
+&#8377; ${diff.toLocaleString('en-IN')}`;
  } else {
    wb.className = 'warn-red';
    wb.innerHTML = `Net Audit Amount: &#8377; ${erpDisplayFmt(total,'money')} | Short: -
&#8377; ${Math.abs(diff).toLocaleString('en-IN')}`;
  }
}
async function saveCashAudit() {
  const sys = Number(document.getElementById('ca_sys_val')?.dataset.val || 0);
  const wb = document.getElementById('ca_warn_box');
  if (!wb) return showAlert('Cash audit form is not available.');
  const act = Number(wb.dataset.total || 0);
  const diff = act - sys;
  const btn = document.querySelector('#modalWin button[onclick="saveCashAudit()"]');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  db.audits = db.audits || {cash:[],bank:[],stock:[]};
  db.audits.cash = db.audits.cash || [];
  db.audits.cash.unshift({
    date: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}),
    sys, act, diff,
    label: diff === 0 ? 'Matched' : (diff > 0 ? `+${diff} Excess` : `${diff} Short`)
  });
  db.audits.cash = db.audits.cash.slice(0, 5);
  try {
    const saved = await saveDb();
    if (saved !== true) throw new Error('Database save was not verified.');
    showAlert('Cash denomination audit saved and verified. You can continue in this audit window or Quit.');
  } catch (e) {
    showAlert('Cash audit save failed: ' + e.message);
  } finally {
    if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = 'Save'; }
  }
}

function calcBankAuditRow(i, sys, val) {
  const chk = document.getElementById('ba_c_' + i);
  const w = document.getElementById('ba_w_' + i);
  if (val === '') {
    chk.checked = false;
    w.textContent = 'Pending';
    w.style.color = '#0f172a';
    return;
  }
  chk.checked = true;
  const diff = parseIndianNumber(val) - Number(sys);
  if (diff === 0) {
    w.textContent = 'Matched';
    w.style.color = '#15803d';
  } else if (diff > 0) {
    w.textContent = `+${diff} Excess`;
    w.style.color = '#b91c1c';
  } else {
    w.textContent = `${diff} Short`;
    w.style.color = '#b91c1c';
  }
}
async function saveBankAudit() {
  const selected = [];
  document.querySelectorAll('.ba-val').forEach((inp, i) => {
    const chk = document.getElementById('ba_c_' + i);
    if (chk && chk.checked) {
      const status = document.getElementById('ba_w_' + i)?.textContent || 'Pending';
      selected.push({name:chk.dataset.name, status});
    }
  });
  if (!selected.length) return showAlert('Enter balance for at least one bank account.');
  const btn = document.querySelector('#modalWin button[onclick="saveBankAudit()"]');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  db.audits = db.audits || {cash:[],bank:[],stock:[]};
  db.audits.bank = db.audits.bank || [];
  const ok = selected.every(x => x.status === 'Matched');
  db.audits.bank.unshift({
    date: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}),
    accounts: selected.map(x=>x.name).join(', '),
    summary: selected.map(x=>`${x.name}: ${x.status}`).join(' | '),
    allMatched: ok
  });
  db.audits.bank = db.audits.bank.slice(0, 5);
  try {

    showAlert('Bank audit save failed: ' + e.message);

    if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = 'Save'; }
  }
}

function applyBusinessProfile(root=document) {
  const name = getBusinessName();
  const address = getBusinessAddress();
  const replacements = [
    ['SRIRAM GEMS &amp; JEWELLERY', name],
    ['SRIRAM GEMS & JEWELLERY', name],
    ['Temple Street, Kakinada - 533001', address],
    ['Temple Street, Kakinada', address]
  ];
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let node;
  while ((node = walker.nextNode())) {
    const parent = node.parentElement;
    if (!parent || /^(SCRIPT|STYLE|TEXTAREA|INPUT)$/i.test(parent.tagName)) continue;
    let value = node.nodeValue;
    for (const [from,to] of replacements) value = value.split(from).join(to);
    if (value !== node.nodeValue) node.nodeValue = value;
  }
  const headerName = document.getElementById('headerBusinessName');
  const headerAddress = document.getElementById('headerBusinessAddress');
  if (headerName && headerName.textContent !== name) headerName.textContent = name;
  if (headerAddress && headerAddress.textContent !== address) headerAddress.textContent = address;
  const loginName = document.getElementById('loginBusinessName');
  const loginAddress = document.getElementById('loginBusinessAddress');
  if (loginName && loginName.textContent !== name) loginName.textContent = name;
  if (loginAddress && loginAddress.textContent !== address) loginAddress.textContent = address;
  const title = document.querySelector('title');
  if (title && title.textContent !== name) title.textContent = name;
  const appTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
  if (appTitle) appTitle.content = name;
  const banner = document.querySelector('.welcome-banner-branding');
  if (banner) {
    const n = banner.querySelector('strong'), a = banner.querySelector('span');
    if (n && n.textContent !== name) n.textContent = name;
    if (a && a.textContent !== address) a.textContent = address;
  }
  const welcomeImg = document.querySelector('.welcome-home-banner');
  if (welcomeImg) welcomeImg.alt = 'Welcome to ' + name + ', ' + address;
}

// Helper functions for Income & Expense ledgers
function getIncomeAndExpenseLedgers() {
  return (db.ledgers || []).filter(l => {
    const grp = (l.group || '').toLowerCase();
    const gObj = (db.ledgerGroups || []).find(g => g.name === l.group);
    const nat = gObj ? (gObj.nature || '').toLowerCase() : '';
    return grp.includes('expense') || grp.includes('income') || grp.includes('salary') || nat === 'expense' || nat === 'income' || nat === 'salary';
  });
}

function isIncomeLedger(name) {
  const l = (db.ledgers || []).find(x => x.name === name);
  if (!l) return false;
  const grp = (l.group || '').toLowerCase();
  const gObj = (db.ledgerGroups || []).find(g => g.name === l.group);
  const nat = gObj ? (gObj.nature || '').toLowerCase() : '';
  return grp.includes('income') || nat === 'income';
}

    const vList = document.querySelectorAll('.dm-val');
    qList.forEach((qEl, i) => {
      const q = parseIndianNumber(qEl.value || 0), r = parseIndianNumber(rList[i]?.value || 0), v = q * r;
      if (vList[i]) vList[i].textContent = v.toLocaleString('en-IN');
      baseTot += v;
    });
    (deliveryDirectItems || []).forEach(it => { baseTot += Number(it.qty || 0) * Number(it.rate || 0); });
  } else {
    document.querySelectorAll('.da-qty').forEach(inp => {
      const q = parseIndianNumber(inp.value || 0); const batches = JSON.parse(inp.dataset.batches || '[]');
      let rem=q, val=0; for (const b of batches) { if(rem<=0) break; const take=Math.min(rem,Number(b.pendingQty||0)); val += take*Number(b.rate||0); rem-=take; }
      baseTot += val;
    });
  }
  const finalTot = baseTot + getDeliveryGeneralTotal();
  const invEl = document.getElementById('d_inv_val'); if (invEl) invEl.value = finalTot;
  calcDeliveryGeneralTotalLabel();
  updateDeliveryPayPart();
}

// ---------------------------------------------------------------------
// Indian number entry + product palette helpers (display-only formatting)
// ---------------------------------------------------------------------
function parseIndianNumber(value) {
  if (typeof value === 'number') return Number.isFinite(value) ? value : 0;
  const cleaned = String(value ?? '').replace(/,/g, '').replace(/[^0-9.+-]/g, '');
  if (!cleaned || cleaned === '-' || cleaned === '.' || cleaned === '+') return 0;
  const n = Number(cleaned);
  return Number.isFinite(n) ? n : 0;
}
function formatIndianInput(value) {
  let raw = String(value ?? '').replace(/,/g, '').replace(/[^0-9.\-]/g, '');
  const negative = raw.startsWith('-'); raw = raw.replace(/-/g, '');
  const pieces = raw.split('.');
  let integer = pieces.shift() || '';
  const decimal = pieces.length ? '.' + pieces.join('').replace(/\./g,'') : '';
  if (!integer && !decimal) return negative ? '-' : '';
  let grouped = integer;
  if (integer.length > 3) {
    const lastThree = integer.slice(-3);
    const leading = integer.slice(0, -3).replace(/\B(?=(\d{2})+(?!\d))/g, ',');
    grouped = leading + ',' + lastThree;
  }
  return (negative ? '-' : '') + grouped + decimal;
}
function setIndianInputValue(id, value) {
  const el = document.getElementById(id);
  if (el) el.value = formatIndianInput(value);
}
function erpBindIndianNumberInputs(root=document) {
  root.querySelectorAll('input[data-indian-number="1"]').forEach(el => {
    if (el.dataset.indianBound === '1') return;
    el.dataset.indianBound = '1';
    el.value = formatIndianInput(el.value);
  });
}
if (!window.__indianNumberFormatBound) {
  window.__indianNumberFormatBound = true;
  document.addEventListener('input', function(event) {
    const el = event.target;
    if (!el || !el.matches || !el.matches('input[data-indian-number="1"]')) return;
    const oldValue = el.value;
    const caret = el.selectionStart ?? oldValue.length;
    const digitsBefore = oldValue.slice(0, caret).replace(/[^0-9]/g, '').length;
    const formatted = formatIndianInput(oldValue);
    if (formatted === oldValue) return;
    el.value = formatted;
    let pos = 0, seen = 0;
    while (pos < formatted.length && seen < digitsBefore) { if (/\d/.test(formatted[pos])) seen++; pos++; }
    try { el.setSelectionRange(pos, pos); } catch (_) {}
  });
  document.addEventListener('focusout', function(event) {
    const el = event.target;
    if (el && el.matches && el.matches('input[data-indian-number="1"]')) el.value = formatIndianInput(el.value);
  });
  const indianObserver = new MutationObserver(records => {
    records.forEach(record => record.addedNodes.forEach(node => {
      if (node.nodeType !== 1) return;
      if (node.matches && node.matches('input[data-indian-number="1"]')) {
        node.value = formatIndianInput(node.value);
      }
      if (node.querySelectorAll) node.querySelectorAll('input[data-indian-number="1"]').forEach(el => { el.value = formatIndianInput(el.value); });
    }));
  });
  indianObserver.observe(document.documentElement, {childList:true,subtree:true});
  document.addEventListener('DOMContentLoaded', () => erpBindIndianNumberInputs(document));
}
function erpProductColor(productName) {
  const palette = [
    {strong:'#0f766e',soft:'#ccfbf1'}, {strong:'#1d4ed8',soft:'#dbeafe'},
    {strong:'#7e22ce',soft:'#f3e8ff'}, {strong:'#c2410c',soft:'#ffedd5'},
    {strong:'#be123c',soft:'#ffe4e6'}, {strong:'#4d7c0f',soft:'#ecfccb'},
    {strong:'#0e7490',soft:'#cffafe'}, {strong:'#a16207',soft:'#fef3c7'}
  ];
  const index = Math.max(0, (db.products || []).findIndex(p => p.name === productName));
  return palette[index % palette.length];
}
function erpProductPendingTypeColor(type) {
  return String(type||'').toLowerCase().includes('purchase')
    ? {strong:'#1d4ed8',soft:'#dbeafe'}
    : {strong:'#047857',soft:'#d1fae5'};
}
function erpPartyPendingColor(productName,type) {
  const index=Math.max(0,(db.products||[]).findIndex(p=>p.name===productName));
  const hue=(index*47+165)%360;
  const purchase=String(type||'').toLowerCase().includes('purchase');
  const h=(hue+(purchase?168:0))%360;
  return {strong:`hsl(${h} 72% 30%)`,soft:`hsl(${h} 82% 91%)`};
}

async function saveMultiPartyOrders() {
  if (!window.multiPartyOrderDrafts.length) return showAlert('Add at least one party.');
  const clean=[]; const seenParties=new Set();
  for (let i=0;i<window.multiPartyOrderDrafts.length;i++) {
    const draft=window.multiPartyOrderDrafts[i];
    if(!draft.party) return showAlert(`Select Party Name in Party ${i+1}.`);
    if(seenParties.has(draft.party)) return showAlert(`Party ${draft.party} is entered more than once. Add all its products in one party section.`);
    seenParties.add(draft.party);
    const items=draft.items.filter(it=>it.product&&parseIndianNumber(it.qty)>0&&parseIndianNumber(it.rate)>0).map(it=>({product:it.product,unit:it.unit||'',qty:parseIndianNumber(it.qty),rate:parseIndianNumber(it.rate),value:parseIndianNumber(it.qty)*parseIndianNumber(it.rate)}));
    if(!items.length) return showAlert(`Add at least one valid Product, Qty and Rate for ${draft.party}.`);
    clean.push({party:draft.party,narration:draft.narration||'',items,totalValue:items.reduce((a,it)=>a+it.value,0)});
  }
  const date=window.multiPartyOrderDate||DEFAULT_DATE;
  const base=generateFyVoucherNo('Orders',date);
  const match=base.match(/^(.*-)(\d+)$/); if(!match) return showAlert('Unable to generate the standard Order voucher series.');
  const prefix=match[1]; let seq=Number(match[2]);
  const existing=new Set((db.orders||[]).map(o=>o.id));
  const created=[];
  for(const item of clean){
    let id; do { id=prefix+String(seq++).padStart(3,'0'); } while(existing.has(id));
    existing.add(id);
    const obj={id,date,type:window.multiPartyOrderType||'Sale',party:item.party,items:JSON.parse(JSON.stringify(item.items)),totalValue:item.totalValue,narration:item.narration,status:db.currentUser.role==='Admin'?'Approved':'Pending',by:db.currentUser.username,trackingNo:'TRK-'+String(id).replace(/[^A-Za-z0-9-]/g,'')};
    created.push(obj);
  }
  const saveButton=document.querySelector('#modalWin button[onclick="saveMultiPartyOrders()"]');
  if(saveButton){saveButton.disabled=true;saveButton.textContent='Saving…';}
  db.orders.push(...created);
  try{
    const saved=await saveDb(); if(saved!==true) throw new Error('Database save was not verified.');
    const first=created[0].id,last=created[created.length-1].id;
    closeModal(); window.multiPartyOrderDrafts=[]; updateHeaderControls(); renderTransaction('orders');
    showAlert(`${created.length} Individual Orders Created Successfully. Generated Vouchers: ${first}${first===last?'':' to '+last}`);
  }catch(e){
    showAlert('Multi Party Orders were not saved: '+e.message+'. Please verify the database connection before retrying.');
    if(saveButton&&saveButton.isConnected){saveButton.disabled=false;saveButton.textContent='Save All Orders';}
  }
}

function renderDeliveryDirectItems() {
  const tb = document.getElementById('d_direct_tbody');
  if (!tb) return;
  tb.innerHTML = deliveryDirectItems.map((it, i) => `<tr>
    <td>
      <select onchange="updateDeliveryDirectProduct(${i}, this.value)" style="width:100%;">
        <option value="">-- Select Product --</option>
        ${db.products.map(p => `<option value="${p.name}" ${p.name===it.product?'selected':''}>${p.name}</option>`).join('')}
      </select>
    </td>
    <td><input type="text" value="${it.unit||''}" readonly style="width:100%;max-width:100%;background:#f1f5f9;box-sizing:border-box;" placeholder="Unit"></td>
    <td><input type="text" inputmode="decimal" data-indian-number="1" value="${it.rate}" oninput="updateDeliveryDirectQtyRate(${i}, 'rate', this.value)" placeholder="Rate" style="width:100%;max-width:100%;box-sizing:border-box;"></td>
    <td><input type="text" inputmode="decimal" data-indian-number="1" value="${it.qty}" oninput="updateDeliveryDirectQtyRate(${i}, 'qty', this.value)" placeholder="Qty" style="width:100%;max-width:100%;box-sizing:border-box;"></td>
    <td class="r" id="d_dir_v_${i}"><b>₹ ${(Number(it.qty||0)*Number(it.rate||0)).toLocaleString('en-IN')}</b></td>
    <td><button class="btn btn-red btn-sm" type="button" onclick="removeDeliveryDirectItem(${i})">X</button></td>
  </tr>`).join('');
  calcManualDelivery();
}

function addDeliveryDirectItem() {
  deliveryDirectItems.push({ product: '', unit: '', rate: '', qty: '', value: 0 });
  renderDeliveryDirectItems();
}

function removeDeliveryDirectItem(i) {
  if (deliveryDirectItems.length > 1) {
    deliveryDirectItems.splice(i, 1);
  } else {
    deliveryDirectItems = [{ product: '', unit: '', rate: '', qty: '', value: 0 }];
  }
  renderDeliveryDirectItems();
}

function updateDeliveryDirectProduct(i, prodName) {
  deliveryDirectItems[i].product = prodName;
  const pr = db.products.find(x => x.name === prodName);
  if (pr) {
    deliveryDirectItems[i].unit = pr.unit || 'GMS';
  } else {
    deliveryDirectItems[i].unit = '';
  }
  deliveryDirectItems[i].rate = '';
  deliveryDirectItems[i].qty = '';
  deliveryDirectItems[i].value = 0;
  renderDeliveryDirectItems();
}

function updateDeliveryDirectQtyRate(i, field, val) {
  deliveryDirectItems[i][field] = val === '' ? '' : parseIndianNumber(val);
  const q = parseIndianNumber(deliveryDirectItems[i].qty || 0);
  const r = parseIndianNumber(deliveryDirectItems[i].rate || 0);
  deliveryDirectItems[i].value = q * r;
  const vEl = document.getElementById('d_dir_v_' + i);
  if (vEl) vEl.innerHTML = `<b>₹ ${(q * r).toLocaleString('en-IN')}</b>`;
  calcManualDelivery();
}

function checkRpSplit() {
  const target = parseIndianNumber(document.getElementById('rp_amt')?.value || 0);
  const cash = parseIndianNumber(document.getElementById('rp_cash')?.value || 0);
  let bankSum = 0;
  (rpBankRows || []).forEach(r => bankSum += Number(r.amount || 0));
  const sum = cash + bankSum;
  const msg = document.getElementById('rp_split_msg');
  if (!msg) return;

  if (target === 0 && cash === 0 && bankSum === 0) {
    msg.style.display = 'none';
    return;
  }
  msg.style.display = 'block';
  if (sum === target && target > 0) {
    msg.className = 'warn-green';
    msg.textContent = `Matched ✓ Cash ₹${cash.toLocaleString('en-IN')} + Bank ₹${erpDisplayFmt(bankSum,'money')} = Total Amount ₹${sum.toLocaleString('en-IN')}`;
  } else {
    msg.className = 'warn-red';
    msg.textContent = `Mismatch ✗ Cash ₹${cash.toLocaleString('en-IN')} + Bank ₹${erpDisplayFmt(bankSum,'money')} = ₹${sum.toLocaleString('en-IN')} must equal Total Amount ₹${target.toLocaleString('en-IN')}`;
  }
}

function calcDenomModal() {

  let tot = 0;
  let list = [];
  document.querySelectorAll('.dm-inp').forEach(inp => {
    const n = Number(inp.dataset.n);
    const q = parseIndianNumber(inp.value || 0);
    document.getElementById('dm_r_' + n).textContent = (n * q).toLocaleString('en-IN');
    if (q > 0) {
      tot += n * q;
      list.push(`${n}x${q}`);
    }
  });
  const msg = document.getElementById('dm_msg');
  msg.dataset.total = tot;
  msg.dataset.text = list.join(', ') + ` = ${tot}`;
  if (tot === target && tot > 0) {

  } else {
    msg.className = 'warn-red';
    msg.textContent = `Total: ₹  ${tot.toLocaleString('en-IN')} | Required: ₹ 
${target.toLocaleString('en-IN')}`;
  }

    if (!order) return showAlert('Order not found.');
    // Prevent deleting an order that has delivery allocations already posted.
    const delivered = getApprovedVouchers().some(v => v.vType === 'Delivery' &&
      (v.items || []).some(it => (it.orderAllocations || []).some(a => a.orderId === id)));
    if (delivered) return showAlert('Cannot delete this order: delivery entries are already linked. Correct or delete the linked delivery first.');
    db.orders = (db.orders || []).filter(o => o.id !== id);

function calcManualDelivery() {
  let tot = 0;
  const rList = document.querySelectorAll('.dm-rate');
  const qList = document.querySelectorAll('.dm-qty');
  const vList = document.querySelectorAll('.dm-val');
  qList.forEach((qEl, i) => {
    const q = parseIndianNumber(qEl.value || 0);
    const r = parseIndianNumber(rList[i].value || 0);
    const v = q * r;
    vList[i].textContent = v.toLocaleString('en-IN');
    tot += v;
  });
  (deliveryDirectItems || []).forEach(it => {
    const q = Number(it.qty || 0);
    const r = Number(it.rate || 0);
    tot += (q * r);
  });
  const othAmt = getDeliveryGeneralTotal();
  const invEl = document.getElementById('d_inv_val');
  if (invEl) invEl.value = formatIndianInput(tot + othAmt);
  updateDeliveryPayPart();
}
function calcAutoDelivery() {
  let grand = 0;
  const vCells = document.querySelectorAll('.da-val');
  document.querySelectorAll('.da-qty').forEach((inp, i) => {
    let rem = parseIndianNumber(inp.value || 0);
    const batches = JSON.parse(inp.dataset.batches);
    let val = 0;
    for (let b of batches) {
      if (rem <= 0) break;
      const take = Math.min(rem, b.pendingQty);
      val += take * b.rate;
      rem -= take;
    }
    if (rem > 0 && batches.length > 0) {
      val += rem * batches[batches.length - 1].rate;
    }
    inp.dataset.val = val;
    if (vCells[i]) vCells[i].textContent = val.toLocaleString('en-IN');
    grand += val;
  });
  document.getElementById('d_inv_val').value = formatIndianInput(grand + getDeliveryGeneralTotal());
  calcDeliveryGeneralTotalLabel();
  updateDeliveryPayPart();
}
function updateDeliveryPayPart() {
  const inv = parseIndianNumber(document.getElementById('d_inv_val')?.value || 0);
  const adv = Number(document.getElementById('d_adv_lbl')?.textContent || 0);
  const useAdv = document.getElementById('d_adj_adv')?.value === 'Yes';
  const adj = useAdv ? Math.min(inv, adv) : 0;
  const rem = inv - adj;

function checkDeliverySplit() {
  const inv = parseIndianNumber(document.getElementById('d_inv_val')?.value || 0);
  const target = parseIndianNumber(document.getElementById('d_pay_amt')?.value || 0);
  const cash = parseIndianNumber(document.getElementById('d_cash_amt')?.value || 0);

  } else if (sum === target) {

${erpDisplayFmt(bankSum,'money')} = Payment ₹ ${sum.toLocaleString('en-IN')} | Invoice 
Balance ₹ ${(inv-target).toLocaleString('en-IN')}`;
  } else {
    msg.className = 'warn-red';
    msg.textContent = `Mismatch ✗  Cash ₹ ${cash.toLocaleString('en-IN')} + Bank ₹
${erpDisplayFmt(bankSum,'money')} = ₹ ${sum.toLocaleString('en-IN')} must equal Payment 
Amount ₹ ${target.toLocaleString('en-IN')}`;
  }
}
function saveDelivery() {
  const pType = document.getElementById('d_ptype').value;
  const partyVal = document.getElementById('d_party').value;
  if (pType === 'Party' && !partyVal) return showAlert('Select Party Name.');
  const selType = document.getElementById('d_seltype').value;
  const items = [];
  try {
  if (selType === 'Manual') {
    const rList = document.querySelectorAll('.dm-rate');
    const qList = document.querySelectorAll('.dm-qty');
    qList.forEach((qEl, i) => {
      const q = parseIndianNumber(qEl.value || 0);
      const r = parseIndianNumber(rList[i].value || 0);
      const pending = Number(qEl.dataset.pending || qEl.max || 0);
      if (q > pending + 1e-9) throw new Error('Delivery Qty for order ' + qEl.dataset.orderId + ' cannot exceed its pending order qty (' + pending + ').');
      if (q > 0) items.push({
        product: qEl.dataset.prod, unit: qEl.dataset.unit || '',
        qty: q, rate: r, value: q * r, orderId: qEl.dataset.orderId,
        orderLineKey: qEl.dataset.orderLineKey,
        orderAllocations: [{ orderId: qEl.dataset.orderId, orderLineKey: qEl.dataset.orderLineKey,
          product: qEl.dataset.prod, unit: qEl.dataset.unit || '', qty: q }]
      });
    });
    (deliveryDirectItems || []).forEach(it => {
      const q = Number(it.qty || 0);
      const r = Number(it.rate || 0);
      if (it.product && q > 0 && r > 0) {
        items.push({ product: it.product, unit: it.unit || 'GMS', qty: q, rate: r, value: q * r });
      }
    });
  } else {
    document.querySelectorAll('.da-qty').forEach(inp => {
      const q = parseIndianNumber(inp.value || 0);
      const v = Number(inp.dataset.val || 0);
      const batches = JSON.parse(inp.dataset.batches || '[]');
      const totalPending = batches.reduce((sum, b) => sum + Number(b.pendingQty || 0), 0);
      if (q > totalPending + 1e-9) throw new Error('Delivery Qty for ' + inp.dataset.prod + ' cannot exceed total pending order qty (' + totalPending + ').');
      if (q > 0) {
        let rem = q;
        const orderAllocations = [];
        for (const b of batches) {
          if (rem <= 0) break;
          const take = Math.min(rem, Number(b.pendingQty || 0));
          if (take > 0) orderAllocations.push({ orderId: b.orderId, orderLineKey: b.orderLineKey,
            product: inp.dataset.prod, unit: b.unit || '', qty: take });
          rem -= take;
        }
        if (rem > 1e-9) throw new Error('Delivery Qty exceeds available pending order qty.');
        items.push({ product: inp.dataset.prod, unit: batches[0]?.unit || '',
          qty: q, rate: Math.round(v / q), value: v, orderAllocations });
      }
    });
  }
  } catch (validationError) {
    return showAlert(validationError.message || 'Invalid delivery quantity.');
  }
  if (items.length === 0) return showAlert('Select Product, Rate and Delivery Qty.');
  // Validate the complete allocation set at save time (not only each input field).
  // This prevents duplicate rows from collectively exceeding an Order Line balance.
  if (pType === 'Party') {
    const subTypeForCheck = document.getElementById('d_sub').value;
    const allocationTotals = new Map();
    items.forEach(it => (it.orderAllocations || []).forEach(a => {
      const key = JSON.stringify([a.orderId, a.orderLineKey || '', it.product]);
      allocationTotals.set(key, (allocationTotals.get(key) || 0) + Number(a.qty || 0));
    }));
    for (const [key, qty] of allocationTotals) {
      const [orderId, lineKey, product] = JSON.parse(key);
      const batch = getPendingOrderBatches(partyVal, subTypeForCheck, product, modifyVType === 'Delivery' ? modifyId : null)
        .find(b => b.orderId === orderId && b.orderLineKey === lineKey);

function upsertVoucher(obj, subTab) {

  obj.trackingNo=obj.trackingNo||oldVoucher?.trackingNo||('TRK-'+String(obj.id||'V').replace(/[^A-Za-z0-9-]/g,''));
  setTimeout(saveDb, 50);
  const idx = db.vouchers.findIndex(v => v.id === obj.id && v.vType === obj.vType);

function promptAdminAuth(actionName, onAuthorized) {
  const m = document.getElementById('modalWin');
  const b = document.getElementById('modalBg');
  if (!m || !b) return;

  m.innerHTML = `
    <div class="voucher-title">
      <span>🔒 Admin Authorization Required</span>
      <button class="btn btn-red btn-sm" onclick="closeModal()">X</button>
    </div>
    <div style="padding:22px 18px;text-align:center;">
      <div style="font-size:14.79px;font-weight:700;color:var(--tp-header);margin-bottom:6px;">
        Admin Password Required
      </div>
      <p style="font-size:12.75px;color:#64748b;margin-bottom:16px;">
        To <b>${actionName}</b>, please enter the Admin Password:
      </p>
      <div style="max-width:280px;margin:0 auto 12px auto;">
        <input type="password" id="admin_auth_pwd" placeholder="Enter Admin Password" style="width:100%;padding:9px 12px;border:1.5px solid #cbd5e1;border-radius:6px;font-size:14.28px;box-sizing:border-box;text-align:center;" onkeydown="if(event.key==='Enter')verifyAdminAuth('${actionName}')">
      </div>
      <div id="admin_auth_err" style="display:none;color:#dc2626;font-size:12.24px;font-weight:600;margin-bottom:12px;background:#fef2f2;padding:6px;border-radius:4px;border:1px solid #fecaca;"></div>
      <div style="display:flex;justify-content:center;gap:10px;">
        <button id="btn_confirm_admin_auth" class="btn btn-gold" style="font-weight:700;padding:8px 20px;" onclick="verifyAdminAuth('${actionName}')">✓ Authorize</button>
        <button class="btn btn-red btn-sm" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  `;
  window.__adminAuthCallback = onAuthorized;
  b.style.display = 'flex';
  setTimeout(() => {
    const inp = document.getElementById('admin_auth_pwd');
    if (inp) inp.focus();
  }, 100);
}

function verifyAdminAuth(actionName) {
  const inp = document.getElementById('admin_auth_pwd');
  const err = document.getElementById('admin_auth_err');
  const val = inp ? inp.value : '';
  const adminUser = (db.users || []).find(u => u.role === 'Admin');
  const adminPwd = adminUser ? adminUser.password : '123';

  if (val === adminPwd) {
    closeModal();
    if (typeof window.__adminAuthCallback === 'function') {
      window.__adminAuthCallback();
    }
  } else {
    if (err) {
      err.textContent = '❌ Incorrect Admin Password! Authorization failed.';
      err.style.display = 'block';
    }
    if (inp) {
      inp.style.borderColor = '#dc2626';
      inp.value = '';
      inp.focus();
    }
  }
}
