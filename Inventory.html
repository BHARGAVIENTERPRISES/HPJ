function performModifyVoucher(vType, id) {
  // Alter always loads saved ORIGINAL voucher values into editable inputs.
  // Value display scaling is intentionally not applied to form population or save payloads.
  const v = db.vouchers.find(x => x.vType === vType && x.id === id);
  if (!v) return showAlert('Voucher not found');
  modifyId = v.id;
  modifyVType = v.vType;
  const tabMap = {
    'Delivery': 'delivery',
    'Receipt': 'receipt',
    'Payment': 'payment',
    'Contra': 'contra',
    'StockGeneral': 'stockgeneral',
    'Salary': 'salary'
  };
  const tab = tabMap[vType] || vType.toLowerCase();
  window.__voucherMode = window.__voucherMode || {};
  window.__voucherMode[tab] = 'register';
  renderTransaction(tab);
  // Populate after render
  setTimeout(() => {
    try {
      if (vType === 'Delivery') {
        document.getElementById('d_date').value = v.date || DEFAULT_DATE;
        document.getElementById('d_no').value = v.id;
        document.getElementById('hdr_d_no').textContent = v.id;
        if (document.getElementById('d_sub')) document.getElementById('d_sub').value = 
v.subType || 'Sale';
        if (document.getElementById('d_ptype')) document.getElementById('d_ptype').value = 
v.partyType || 'Party';
        if (document.getElementById('d_party')) document.getElementById('d_party').value = 
v.party || '';
        const hasSavedAllocations = (v.items || []).some(it => Array.isArray(it.orderAllocations) && it.orderAllocations.length);
        // Manual mode is used while altering an allocated Delivery so its exact
        // original Order Line allocations can be restored without FIFO reshuffling.
        if (document.getElementById('d_seltype'))
        document.getElementById('d_seltype').value = hasSavedAllocations ? 'Manual' : (v.selectType || 'Manual');
        deliveryGeneralRows = Array.isArray(v.generalLedgers) && v.generalLedgers.length ? v.generalLedgers.map(r => ({ ledger:r.ledger || '', amount:r.amount ?? '' })) : (v.generalLedger ? [{ ledger:v.generalLedger, amount:v.generalLedgerAmount || 0 }] : [{ ledger:'', amount:'' }]);
        updateDeliveryOrdersView();
        renderDeliveryGeneralRows();
        // After view rebuild, try to fill direct items if exist
    setTimeout(() => {
      if (v.items && v.items.length) {
        const restoredAllocations = new Map();
        deliveryDirectItems = [];
        v.items.forEach(it => {
          const allocations = Array.isArray(it.orderAllocations) ? it.orderAllocations : [];
          let allocatedQty = 0;
          allocations.forEach(a => {
            const key = `${a.orderId}::${a.orderLineKey || ''}`;
            restoredAllocations.set(key, (restoredAllocations.get(key) || 0) + Number(a.qty || 0));
            allocatedQty += Number(a.qty || 0);
          });
          const directQty = Math.max(0, Number(it.qty || 0) - allocatedQty);
          if (!allocations.length || directQty > 1e-9) {
            const q = allocations.length ? directQty : Number(it.qty || 0);
            if (q > 1e-9) deliveryDirectItems.push({
              product: it.product, unit: it.unit || 'GMS', rate: it.rate,
              qty: q, value: q * Number(it.rate || 0)
            });
          }
        });
        if (!deliveryDirectItems.length) deliveryDirectItems = [{ product:'', unit:'', rate:'', qty:'', value:0 }];
        renderDeliveryDirectItems();
        // Restore exact quantities against each Order + Order Line key.
        document.querySelectorAll('.dm-qty').forEach(inp => {
          const key = `${inp.dataset.orderId}::${inp.dataset.orderLineKey || ''}`;
          if (restoredAllocations.has(key)) inp.value = restoredAllocations.get(key);
        });
        calcManualDelivery();
      }
      if (document.getElementById('d_inv_val')) document.getElementById('d_inv_val').value = formatIndianInput(v.totalAmount || 0);
      if (document.getElementById('d_adj_adv')) document.getElementById('d_adj_adv').value = v.adjustAdvance || 'No';
      if (document.getElementById('d_terms')) document.getElementById('d_terms').value = v.payTerms || 'Credit';
      if (document.getElementById('d_pay_amt')) document.getElementById('d_pay_amt').value = v.paymentEntered || 0;
      if (document.getElementById('d_cash_amt')) document.getElementById('d_cash_amt').value = v.cashPaid || 0;
       if (document.getElementById('d_cash_ledger')) document.getElementById('d_cash_ledger').value = v.cashLedgerId || '';
      if (document.getElementById('d_narr')) document.getElementById('d_narr').value = v.narration || '';
      deliveryBankRows = (v.bankSplits && v.bankSplits.length)
        ? v.bankSplits.map(s => ({ bank: s.bank||'', accNo: s.accNo||'', utr: s.utr||'', amount: s.amount||'' }))
        : [{ bank: '', accNo: '', utr: '', amount: '' }];
      if (typeof renderDeliveryBankRows === 'function') renderDeliveryBankRows();
      updateDeliveryPayPart();
      calcManualDelivery();
    }, 50);
      } else if (vType === 'Receipt' || vType === 'Payment') {
        document.getElementById('rp_date').value = v.date || DEFAULT_DATE;
        document.getElementById('rp_no').value = v.id;
        const hdr = document.getElementById('hdr_rp_no');
        if (hdr) hdr.textContent = v.id;
        if (document.getElementById('rp_party')) document.getElementById('rp_party').value 
= v.party || '';
        if (document.getElementById('rp_ref')) document.getElementById('rp_ref').value = 
v.refType || 'Advance';
        if (document.getElementById('rp_amt')) document.getElementById('rp_amt').value = 
v.amount || '';
        if (document.getElementById('rp_cash')) document.getElementById('rp_cash').value = 
v.cashAmount || '';
        if (document.getElementById('rp_denom')) document.getElementById('rp_denom').value 
= v.denomination || '';
        if (document.getElementById('rp_narr')) document.getElementById('rp_narr').value = 
v.narration || '';
        rpItems = (v.items && v.items.length) ? JSON.parse(JSON.stringify(v.items)) : [];
        rpBankRows = (v.bankSplits && v.bankSplits.length)
          ? v.bankSplits.map(s => ({ bank: s.bank||'', accNo: s.accNo||'', utr: s.utr||'', 
amount: s.amount||'' }))
          : [{ bank: '', accNo: '', utr: '', amount: '' }];
        if (typeof renderRpBankRows === 'function') renderRpBankRows();
      } else if (vType === 'Contra') {
        document.getElementById('c_date').value = v.date || DEFAULT_DATE;
        document.getElementById('c_no').value = v.id;
        if (document.getElementById('hdr_c_no')) 
document.getElementById('hdr_c_no').textContent = v.id;
        if (document.getElementById('c_type')) document.getElementById('c_type').value = 
v.contraType || 'Cash to Bank';
        if (document.getElementById('c_from')) document.getElementById('c_from').value = 
v.fromAcc || '';
        if (document.getElementById('c_to')) document.getElementById('c_to').value = 
v.toAcc || '';
        if (document.getElementById('c_amt')) document.getElementById('c_amt').value = 
v.amount || '';
        if (document.getElementById('c_denom')) document.getElementById('c_denom').value = 
v.denomination || '';
        if (document.getElementById('c_utr')) document.getElementById('c_utr').value = 
v.utr || '';
        if (document.getElementById('c_narr')) document.getElementById('c_narr').value = 
v.narration || '';
      } else if (vType === 'StockGeneral') {
        document.getElementById('sg_vdate').value = v.date || DEFAULT_DATE;
        document.getElementById('sg_vno').value = v.id;
        if (document.getElementById('hdr_sg_no'))

'' }];
        stockGenCrItems = (v.creditItems && v.creditItems.length)
          ? JSON.parse(JSON.stringify(v.creditItems))
          : [{ product: v.creditProduct || '', qty: v.creditQty || '', rate: v.creditRate 
|| '' }];

= v.narration || '';
      } else if (vType === 'Salary') {
        document.getElementById('sal_date').value = v.date || DEFAULT_DATE;

document.getElementById('hdr_sal_no').textContent = v.id;

document.getElementById('sal_staff').value = v.staff || '';

v.amount || '';

v.utr || '';

= v.narration || '';
      }
    } catch (e) {
      console.error('modifyVoucher populate error', e);
    }
  }, 30);
  setTimeout(() => openAlterFormPopup('v_form_pane_' + tab, vType + ' [' + v.id + ']'), 180);
}
function deleteVoucher(vType, id, tab) {

// VALUE DISPLAY POLICY (display layer only):
// - None: original monetary values, 0 decimal places.
// - Option 1: monetary values / 10, exactly 1 decimal place.
// - Option 2: monetary values / 100, exactly 2 decimal places.
// - Quantity is NEVER divided by any option and retains its normal quantity precision.
// All database values, entry inputs, Alter form values, and accounting calculations stay ORIGINAL.
// A calculated amount (qty * original rate) is divided for display exactly once, which is
// mathematically the same as qty * displayed rate. Never feed a display value back into a calculation.
function erpValueMode(){
  return ['none','1','2'].includes(String(db.settings?.valueDisplayMode||'none'))
    ? String(db.settings.valueDisplayMode) : 'none';
}
function erpValueDivisor(kind='money'){
  if(kind==='qty') return 1;
  const mode=erpValueMode();
  return mode==='2'?100:(mode==='1'?10:1);
}
function erpDisplayValue(value, kind='money'){
  const n=Number(value??0);
  return n/erpValueDivisor(kind);
}
function erpDisplayFmt(value, kind='money', digits=2){
  const mode=erpValueMode();
  // Monetary precision is controlled by Value mode. Quantity keeps its own precision.
  const precision = kind==='qty' ? null : (mode==='none'?0:(mode==='1'?1:2));
  const opts = precision===null
    ? {minimumFractionDigits:0, maximumFractionDigits:digits}
    : {minimumFractionDigits:precision, maximumFractionDigits:precision};
  return erpDisplayValue(value,kind).toLocaleString('en-IN',opts);
}
function erpDisplayMoney(value){return '₹ '+erpDisplayFmt(value,'money');}
function erpDisplayQty(value){return erpDisplayFmt(value,'qty',3);}
// Direct/manual amounts (including Receipt and Payment) use the same one-time display scale.
function erpDisplayDirectAmount(value){return erpDisplayFmt(value,'money');}
// Calculated amount: originalQty * originalRate, converted once for display only.
function erpDisplayCalculatedAmount(originalQty, originalRate){
  return erpDisplayFmt(Number(originalQty||0)*Number(originalRate||0),'money');
}

function getLedgerClosingBalance(ledgerName) {
  const l = db.ledgers.find(x => x.name === ledgerName);
  if (!l) return 0;
  if (l.group === 'Cash in Hand') return getCashBal();
  if (['Bank Account','Bank Accounts'].includes(l.group) || erpNatureForGroup(l.group)==='Bank') {
    const b = getBankBals().find(x => x.name === ledgerName);
    return b ? b.balance : Number(l.openBal || 0);
  }
  if (['Debtors','Creditors','Sundry Debtors','Sundry Creditors'].includes(l.group) || ['Debtor','Creditor'].includes(erpNatureForGroup(l.group))) {
    const p = getPartyBals().find(x => x.name === ledgerName);
    return p ? Math.abs(p.netBal) : Number(l.openBal || 0);
  }
  let running = Number(l.openBal || 0);
  for (const v of getApprovedVouchers()) {
    if (v.vType === 'Receipt') {
      if (v.party === ledgerName) running -= Number(v.amount || 0);
      if (v.party === 'Non-Party' && Array.isArray(v.nonPartyItems)) {
        v.nonPartyItems.forEach(it => { if (it.ledger === ledgerName) running -= Number(it.amount || 0); });
      }
    } else if (v.vType === 'Payment') {
      if (v.party === ledgerName) running += Number(v.amount || 0);
      if (v.party === 'Non-Party' && Array.isArray(v.nonPartyItems)) {
        v.nonPartyItems.forEach(it => { if (it.ledger === ledgerName) running += Number(it.amount || 0); });
      }
    }
    else if (v.vType === 'Delivery') {
      if (v.generalLedger === ledgerName && Number(v.generalAmount || 0) > 0) {
        const isInc = isIncomeLedger(ledgerName);
        if (isInc) running -= Number(v.generalAmount || 0);
        else running += Number(v.generalAmount || 0);
      }
      if (v.party === ledgerName) {
        if (v.subType === 'Sale') running += (Number(v.totalAmount || 0) - (Number(v.cashPaid || 0) + (v.bankSplits || []).reduce((s,b)=>s+Number(b.amount||0),0)));
        if (v.subType === 'Purchase') running -= (Number(v.totalAmount || 0) - (Number(v.cashPaid || 0) + (v.bankSplits || []).reduce((s,b)=>s+Number(b.amount||0),0)));
      }
    }
  }
  return Math.abs(running);
}

function getLedgerBalanceTag(ledgerName) {
  const l = db.ledgers.find(x => x.name === ledgerName);
  if (!l) return '';
  if (l.group === 'Cash in Hand') return 'Dr';
  if (['Bank Account','Bank Accounts'].includes(l.group) || erpNatureForGroup(l.group)==='Bank') {
    const b = getBankBals().find(x => x.name === ledgerName);
    return (b && b.balance >= 0) ? 'Dr' : 'Cr';
  }
  if (['Debtors','Creditors','Sundry Debtors','Sundry Creditors'].includes(l.group) || ['Debtor','Creditor'].includes(erpNatureForGroup(l.group))) {
    const p = getPartyBals().find(x => x.name === ledgerName);
    return (p && p.netBal >= 0) ? 'Dr' : 'Cr';
  }
  return 'Dr';
}

function renderLedgerTxnRows(ledgerName) {
  const fromDt = document.getElementById('stmt_from')?.value || '2026-04-01';
  const toDt = document.getElementById('stmt_to')?.value || DEFAULT_DATE;
  const l = db.ledgers.find(x => x.name === ledgerName);
  if (!l) return;
  const isCashLedger = (l.group === 'Cash in Hand' || ledgerName === 'Cash in Hand' || ledgerName.toLowerCase().includes('cash'));
  let running = Number(l.openBal || 0);
  const rows = [];

  // Build proper debit/credit lines for this ledger only
  for (const v of getApprovedVouchers()) {
    if (v.date < fromDt || v.date > toDt) continue;
    const lines = []; // {dr, cr, particulars}

    if (v.vType === 'Receipt') {
      // Party Cr, Cash/Bank Dr
      if (v.party === ledgerName) {
        lines.push({ dr: 0, cr: Number(v.amount||0), part: `Receipt ${v.id}` });
      }
      if (v.party === 'Non-Party' && Array.isArray(v.nonPartyItems)) {
        v.nonPartyItems.forEach(it => {
          if (it.ledger === ledgerName) {
            lines.push({ dr: 0, cr: Number(it.amount||0), part: `Receipt [Non-Party] ${v.id}` });
          }
        });
      }
      if (isCashLedger && Number(v.cashAmount||0) > 0) {
        lines.push({ dr: Number(v.cashAmount||0), cr: 0, part: `Receipt Cash from ${v.party||'Counter'}` });
      }
      (v.bankSplits||[]).forEach(s => {
        if (s.bank === ledgerName && Number(s.amount||0) > 0) {
          lines.push({ dr: Number(s.amount||0), cr: 0, part: `Receipt Bank from ${v.party||'Counter'}` });
        }
      });
    } else if (v.vType === 'Payment') {
      // Party Dr, Cash/Bank Cr
      if (v.party === ledgerName) {
        lines.push({ dr: Number(v.amount||0), cr: 0, part: `Payment ${v.id}` });
      }
      if (v.party === 'Non-Party' && Array.isArray(v.nonPartyItems)) {
        v.nonPartyItems.forEach(it => {
          if (it.ledger === ledgerName) {
            lines.push({ dr: Number(it.amount||0), cr: 0, part: `Payment [Non-Party] ${v.id}` });
          }
        });
      }
      if (isCashLedger && Number(v.cashAmount||0) > 0) {
        lines.push({ dr: 0, cr: Number(v.cashAmount||0), part: `Payment Cash to ${v.party||'Party'}` });
      }
      (v.bankSplits||[]).forEach(s => {
        if (s.bank === ledgerName && Number(s.amount||0) > 0) {
          lines.push({ dr: 0, cr: Number(s.amount||0), part: `Payment Bank to ${v.party||'Party'}` });
        }
      });
    } else if (v.vType === 'Delivery') {
      const paid = Number(v.cashPaid||0) + (v.bankSplits||[]).reduce((s,b)=>s+Number(b.amount||0),0);
      const total = Number(v.totalAmount||0);
      if (v.subType === 'Sale') {
        if (v.party === ledgerName) {
          if (total > 0) lines.push({ dr: total, cr: 0, part: `Sale Delivery ${v.id}` });
          if (paid > 0) lines.push({ dr: 0, cr: paid, part: `Payment against ${v.id}` });
        }
        if (isCashLedger && Number(v.cashPaid||0) > 0) {
          lines.push({ dr: Number(v.cashPaid||0), cr: 0, part: `Sale Cash from ${v.party||'Customer'}` });
        }
        (v.bankSplits||[]).forEach(s => {
          if (s.bank === ledgerName && Number(s.amount||0) > 0) {
            lines.push({ dr: Number(s.amount||0), cr: 0, part: `Sale Bank from ${v.party||'Customer'}` });
          }
        });
      } else if (v.subType === 'Purchase') {
        if (v.party === ledgerName) {
          if (total > 0) lines.push({ dr: 0, cr: total, part: `Purchase Delivery ${v.id}` });
          if (paid > 0) lines.push({ dr: paid, cr: 0, part: `Payment against ${v.id}` });
        }
        if (isCashLedger && Number(v.cashPaid||0) > 0) {
          lines.push({ dr: 0, cr: Number(v.cashPaid||0), part: `Purchase Cash to ${v.party||'Supplier'}` });
        }
        (v.bankSplits||[]).forEach(s => {
          if (s.bank === ledgerName && Number(s.amount||0) > 0) {
            lines.push({ dr: 0, cr: Number(s.amount||0), part: `Purchase Bank to ${v.party||'Supplier'}` });
          }
        });
      }
    } else if (v.vType === 'Contra') {
      if (v.fromAcc === ledgerName || (isCashLedger && (v.fromAcc||'').toLowerCase().includes('cash'))) {
        lines.push({ dr: 0, cr: Number(v.amount||0), part: `Contra to ${v.toAcc}` });
      }
      if (v.toAcc === ledgerName || (isCashLedger && (v.toAcc||'').toLowerCase().includes('cash'))) {
        lines.push({ dr: Number(v.amount||0), cr: 0, part: `Contra from ${v.fromAcc}` });
      }
    } else if (v.vType === 'Salary') {
      if (v.staff === ledgerName) {
        lines.push({ dr: Number(v.amount||0), cr: 0, part: `Salary ${v.id}` });
      }
      if (v.payAccount === ledgerName || (isCashLedger && (v.payAccount||'').toLowerCase().includes('cash'))) {
        lines.push({ dr: 0, cr: Number(v.amount||0), part: `Salary Cash to ${v.staff}` });
      }
    }

    lines.forEach(ln => {
      rows.push({
        date: v.date,
        vNo: v.id,
        vType: v.vType + (v.subType ? ' ' + v.subType : ''),
        part: ln.part,
        dr: ln.dr,
        cr: ln.cr
      });
    });
  }

  // Sort chronological
  rows.sort((a,b) => (a.date||'').localeCompare(b.date||'') || (a.vNo||'').localeCompare(b.vNo||''));
  const isDefaultView = (!window.stmtCustomDateFiltered && fromDt === '2026-04-01' && toDt === DEFAULT_DATE);
  const totalCount = rows.length;
  const displayedRows = (isDefaultView && totalCount > 108) ? rows.slice(-108) : rows;

  // recompute running balance from opening
  running = Number(l.openBal || 0);
  for (const r of rows) {
    if (r.date < fromDt) {
      running += (r.dr - r.cr);
    }
  }

  const audTh = stmtAuditMode ? `<th style="text-align:center;width:60px;"><input type="checkbox" id="stmt_check_all" onchange="toggleAllStmtAudit('${ledgerName}', this.checked)"> Audit</th>` : '';
  const capLabel = (isDefaultView && totalCount > 108) ? `<span style="font-size:11.22px;color:#fbbf24;">(Showing Recent 108 of ${totalCount} entries)</span>` : `<span style="font-size:11.22px;color:#86efac;">(Showing ${displayedRows.length} entries in selected period)</span>`;

  let html = `
    <div style="font-weight:700;font-size:12.24px;margin-bottom:6px;color:var(--tp-header);display:flex;justify-content:space-between;align-items:center;">
      <span>Transactions for ${ledgerName} ${capLabel}</span>
      <span style="font-size:11.22px;color:#64748b;">Period: ${formatDdMmYy(fromDt)} to ${formatDdMmYy(toDt)}</span>
    </div>
    <table>
      <thead><tr>
        ${audTh}
        <th>Date</th><th>Voucher Type</th><th>Voucher No</th><th>Particulars</th>
        <th class="r">Debit (In)</th><th class="r">Credit (Out)</th><th class="r">Balance</th>
      </tr></thead>
      <tbody>
  `;

  if (displayedRows.length === 0) {
    html += `<tr><td colspan="${stmtAuditMode?8:7}" style="text-align:center;padding:16px;color:#64748b;">No transactions found for ${ledgerName} in selected period</td></tr>`;
  } else {
    displayedRows.forEach(r => {
      running += (r.dr - r.cr);
      const k = ledgerName + '_' + r.vNo + '_' + r.date + '_' + r.dr + '_' + r.cr;
      const audTd = stmtAuditMode ? `<td style="text-align:center;"><input type="checkbox" class="stmt-row-check" data-k="${k}" ${(db.auditedStatements&&db.auditedStatements[k])?'checked':''} onchange="setStmtAudit('${k}', this.checked, '${ledgerName}')"></td>` : '';
      html += `<tr>
        ${audTd}
        <td>${formatDdMmYy(r.date)}</td>
        <td>${r.vType}</td>
        <td><b>${r.vNo}</b></td>
        <td>${r.part}</td>
        <td class="r" style="color:var(--tp-green);font-weight:600;">${r.dr ? ' ₹  ' + erpDisplayFmt(r.dr,'money') : '-'}</td>
        <td class="r" style="color:var(--tp-red);font-weight:600;">${r.cr ? ' ₹  ' + erpDisplayFmt(r.cr,'money') : '-'}</td>
        <td class="r"><b> ₹  ${erpDisplayFmt(Math.abs(running),'money')} ${running>=0?'Dr':'Cr'}</b></td>
      </tr>`;
    });
  }
  html += '</tbody></table>';

  const box = document.getElementById('stmt_txn_box');
  if (box) box.innerHTML = html;
  if (stmtAuditMode) setTimeout(updateStmtAuditSummary, 20);
}
function renderVoucherBooksHome() {

/* PRODUCT LEDGER — dedicated presentation layer; uses existing approved source records */
function getProductLedgerMovements(productName) {
  const rows = [];
  const p = (db.products || []).find(x => x.name === productName);
  if (!p) return rows;
  rows.push({date:'0000-01-01', id:'OPENING', type:'Opening', party:'-', inQty:Number(p.openQty||0), outQty:0, rate:Number(p.openQty||0)>0?Number(p.value??(Number(p.openQty||0)*Number(p.rate||0)))/Number(p.openQty||0):0, value:Number(p.value??(Number(p.openQty||0)*Number(p.rate||0))), source:'opening',trackingNo:'—'});
  for (const v of getApprovedVouchers()) {
    if (v.vType === 'Delivery') (v.items || []).forEach(it => {
      if (it.product !== productName) return;
      const q=Number(it.qty||0), r=Number(it.rate||0), inward=v.subType==='Purchase';
      rows.push({date:v.date,id:v.id,type:inward?'Purchase':'Sale',party:v.party||'-',inQty:inward?q:0,outQty:inward?0:q,rate:r,value:q*r,source:'voucher',vType:v.vType,trackingNo:v.trackingNo||('TRK-'+String(v.id).replace(/[^A-Za-z0-9-]/g,''))});
    });
    if (v.vType === 'StockGeneral') {
      const ins=Array.isArray(v.debitItems)?v.debitItems:(v.debitProduct?[{product:v.debitProduct,qty:v.debitQty,rate:v.debitRate}]:[]);
      const outs=Array.isArray(v.creditItems)?v.creditItems:(v.creditProduct?[{product:v.creditProduct,qty:v.creditQty,rate:v.creditRate}]:[]);
      ins.forEach(it=>{if(it.product===productName){const q=Number(it.qty||0),r=Number(it.rate||0);rows.push({date:v.date,id:v.id,type:'Stock Journal (In)',party:'-',inQty:q,outQty:0,rate:r,value:q*r,source:'voucher',vType:v.vType,trackingNo:v.trackingNo||('TRK-'+String(v.id).replace(/[^A-Za-z0-9-]/g,''))});}});
      outs.forEach(it=>{if(it.product===productName){const q=Number(it.qty||0),r=Number(it.rate||0);rows.push({date:v.date,id:v.id,type:'Stock Journal (Out)',party:'-',inQty:0,outQty:q,rate:r,value:q*r,source:'voucher',vType:v.vType,trackingNo:v.trackingNo||('TRK-'+String(v.id).replace(/[^A-Za-z0-9-]/g,''))});}});
    }
  }
  (db.unfixInvoices||[]).forEach(u=>{
    if((u.status||'Approved')!=='Approved'||u.product!==productName)return;
    const q=Number(u.qty||0),r=Number(u.provisionalRate||0), inward=u.type==='Purchase';
    rows.push({date:u.date,id:u.id||'UNFIX',type:inward?'Unfix Purchase':'Unfix Sale',party:u.party||'-',inQty:inward?q:0,outQty:inward?0:q,rate:r,value:q*r,source:'unfix',trackingNo:u.trackingNo||('TRK-'+String(u.id||'UF').replace(/[^A-Za-z0-9-]/g,''))});
  });
  // Pending orders are displayed for tracking only; they do not affect physical stock balance.
  const orderParties=[...new Set(getApprovedOrders().filter(o=>(o.items||[]).some(it=>it.product===productName)).map(o=>o.party).filter(Boolean))];
  orderParties.forEach(party=>['Purchase','Sale'].forEach(kind=>getPendingOrderBatches(party,kind,productName).forEach(b=>{
    rows.push({date:b.date,id:b.orderId||'ORDER',type:kind==='Purchase'?'Purchase Orders':'Sale Orders',party,orderQty:Number(b.pendingQty||0),inQty:0,outQty:0,rate:Number(b.rate||0),value:Number(b.value||0),source:'order',nonStock:true,trackingNo:b.trackingNo||('TRK-'+String(b.orderId||'ORDER').replace(/[^A-Za-z0-9-]/g,''))});
  })));
  rows.sort((a,b)=>String(a.date).localeCompare(String(b.date)) || (a.source==='opening'?-1:1));
  let bal=0; rows.forEach(x=>{bal+=x.inQty-x.outQty;x.balance=bal;});
  return rows;
}

function renderStatementsData() {
  const lEl = document.getElementById('stmt_ledger');
  const bEl = document.getElementById('stmt_box');
  if (!lEl || !bEl) return;
  const selLedger = lEl.value;
  const fromDt = document.getElementById('stmt_from').value;
  const toDt = document.getElementById('stmt_to').value;
  const list = getApprovedVouchers().filter(v => {
    const inDate = (!fromDt || v.date >= fromDt) && (!toDt || v.date <= toDt);
    if (!inDate) return false;
    if (selLedger === 'ALL') return true;
    const matchParty = v.party === selLedger || v.staff === selLedger || v.fromAcc === 
selLedger || v.toAcc === selLedger || v.payAccount === selLedger;
    const matchBank = (v.bankSplits || []).some(b => b.bank === selLedger);
    const matchCash = selLedger === 'Cash in Hand' && (Number(v.cashPaid || 0) > 0 || 
Number(v.cashAmount || 0) > 0);
    return matchParty || matchBank || matchCash;
  });
  let runningBal = 0;
  if (selLedger !== 'ALL') {
    const lObj = db.ledgers.find(l => l.name === selLedger);
    if (lObj) runningBal = Number(lObj.openBal || 0);
  }
  document.getElementById('stmt_box').innerHTML = `
    <p style="margin-bottom:6px;font-weight:700;">Opening Balance: &#8377; 
${erpDisplayFmt(runningBal,'money')}</p>
    <table>
      <thead><tr><th>Date</th><th>Voucher No</th><th>Type</th><th>Tracking ID</th><th>Particulars</th><th 
class="r">Debit (Dr)</th><th class="r">Credit (Cr)</th><th class="r">Balance</th></tr>
</thead>
      <tbody>
        ${shownList.map(v => {
          const amt = Number(v.totalAmount || v.amount || 0);
          const isDr = v.vType === 'Delivery' && v.subType === 'Sale' || v.vType === 
'Payment' || v.vType === 'Salary';
          if (isDr) runningBal -= amt; else runningBal += amt;
          return `<tr>
            <td>${formatDdMmYy(v.date)}</td><td><b>${v.id}</b></td><td>${v.vType} ${v.subType || ''}
</td>
            <td>${v.party || v.staff || (v.fromAcc ? `${v.fromAcc} -> ${v.toAcc}` : 
v.debitProduct)}</td>
            <td class="r" style="color:var(--tp-green);">${isDr ? ' ₹  ' + 
erpDisplayFmt(amt,'money') : '-'}</td>
            <td class="r" style="color:var(--tp-red);">${!isDr ? ' ₹  ' + 
erpDisplayFmt(amt,'money') : '-'}</td>
            <td class="r"><b> ₹  ${erpDisplayFmt(Math.abs(runningBal),'money')} 
${runningBal>=0?'Dr':'Cr'}</b></td>
          </tr>`;
        }).join('') || '<tr><td colspan="7">No statement entries found</td></tr>'}
      </tbody>
    </table>
  `;
}

function getUnfixReservedOrderQty(inv) {
  return (inv?.ordersAgainst || []).reduce((sum, order) =>
    sum + (order.status === 'Rejected' ? 0 : Number(order.qty || 0)), 0);
}

let editingUnfixId = null;

function alterUnfix(id) {
  promptAdminAuth('Alter Unfix Invoice [' + id + ']', () => {
    performAlterUnfix(id);
  });
}

function performAlterUnfix(id) {
  const u = (db.unfixInvoices || []).find(x => x.id === id);
  if (!u) return showAlert('Unfix invoice not found.');
  editingUnfixId = id;
  document.getElementById('uf_no').value = u.id;
  document.getElementById('uf_date').value = u.date;
  document.getElementById('uf_type').value = u.type;
  document.getElementById('uf_party').value = u.party;
  document.getElementById('uf_prod').value = u.product;
  document.getElementById('uf_qty').value = u.qty;
  document.getElementById('uf_rate').value = u.provisionalRate;
  document.getElementById('uf_narr').value = u.narration || '';
  const btn = document.querySelector("button[onclick='saveUnfix()']");
  if (btn) btn.textContent = 'Update Unfix';
  showAlert('Editing Unfix Invoice [' + id + ']. Modify details and click Update Unfix.');
}

function deleteUnfix(id) {
  const u = (db.unfixInvoices || []).find(x => x.id === id);
  if (!u) return showAlert('Unfix invoice not found.');
  if (u.ordersAgainst && u.ordersAgainst.length > 0) {
    return showAlert('Cannot delete unfix invoice [' + id + '] because it already has fixed orders against it.');
  }
  promptAdminAuth('Delete Unfix Invoice [' + id + ']', () => {
    db.unfixInvoices = db.unfixInvoices.filter(x => x.id !== id);
    saveDb();
    renderUnfix();
    showAlert('✓ Unfix Invoice [' + id + '] deleted successfully.');
  });
}

function openFixModal(id) {
  const u = (db.unfixInvoices || []).find(x => x.id === id);
  if (!u) return showAlert('Unfix invoice not found.');
  const fixed = getUnfixReservedOrderQty(u);
  const pending = Number(u.qty || 0) - fixed;
  if (pending <= 0) return showAlert('This Unfix Invoice is already 100% fixed!');

  const m = document.getElementById('modalWin');
  const b = document.getElementById('modalBg');
  if (!m || !b) return;

  m.innerHTML = `
    <div class="voucher-title">
      <span>🔨 Fix Unfix Invoice - ${u.id} (${u.type})</span>
      <button class="btn btn-red btn-sm" onclick="closeModal()">X</button>
    </div>
    <div style="padding:16px;">
      <div style="background:#f8fafc;padding:10px;border-radius:6px;margin-bottom:12px;font-size:12.24px;border:1px solid #e2e8f0;">
        <div><b>Party:</b> ${u.party} &bull; <b>Product:</b> ${u.product}</div>
        <div style="margin-top:3px;"><b>Total Qty:</b> ${u.qty} | <b>Fixed Qty:</b> ${fixed} | <b style="color:var(--tp-gold);">Pending Unfixed Qty: ${pending}</b></div>
        <div style="margin-top:3px;color:#64748b;">Provisional Rate: ₹ ${Number(u.provisionalRate||0).toLocaleString('en-IN')}</div>
      </div>
      <div class="f-row">
        <div class="f-grp"><label>Fix Date</label><input type="date" id="fix_date" value="${DEFAULT_DATE}"></div>
        <div class="f-grp"><label>Fix Qty (Max: ${pending})</label><input type="text" inputmode="decimal" data-indian-number="1" id="fix_qty" value="${pending}" max="${pending}" min="0.001" step="any"></div>
        <div class="f-grp"><label>Final Fixed Rate (₹)</label><input type="text" inputmode="decimal" data-indian-number="1" id="fix_rate" value="${u.provisionalRate||''}" placeholder="Enter agreed rate"></div>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px;">
        <button class="btn btn-gold" style="font-weight:700;" onclick="confirmFixUnfix('${u.id}')">✓ Confirm &amp; Fix Rate</button>
        <button class="btn btn-red btn-sm" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  `;
  b.style.display = 'flex';
}

function confirmFixUnfix(id) {
  const u = (db.unfixInvoices || []).find(x => x.id === id);
  if (!u) return;
  const fixed = getUnfixReservedOrderQty(u);
  const pending = Number(u.qty || 0) - fixed;
  const fDate = document.getElementById('fix_date').value;
  const fQty = parseIndianNumber(document.getElementById('fix_qty').value || 0);
  const fRate = parseIndianNumber(document.getElementById('fix_rate').value || 0);

  if (fQty <= 0 || fQty > pending) return showAlert('Invalid Fix Qty. Must be between 0 and ' + pending);
  if (fRate <= 0) return showAlert('Please enter a valid Final Fixed Rate.');

  if (!u.ordersAgainst) u.ordersAgainst = [];
  const fixOrderNo = 'FX-' + Date.now().toString().slice(-4);
  u.ordersAgainst.push({ id: fixOrderNo, date: fDate, qty: fQty, rate: fRate });

  saveDb();
  closeModal();
  renderUnfix();
  showAlert('✓ Successfully fixed ' + fQty + ' against Unfix Invoice [' + id + '] at ₹ ' + fRate.toLocaleString('en-IN') + '!');
}

function saveUnfix() {
  const party = document.getElementById('uf_party').value;
  const product = document.getElementById('uf_prod').value;
  const qty = parseIndianNumber(document.getElementById('uf_qty').value || 0);
  const rate = parseIndianNumber(document.getElementById('uf_rate').value || 0);
  if (!party || !product || !(qty > 0)) return showAlert('Select Party, Product and enter a valid Qty.');
  const date = document.getElementById('uf_date').value;
  if (!date) return showAlert('Select Unfix Invoice Date.');

  if (editingUnfixId) {
    const existing = (db.unfixInvoices || []).find(x => x.id === editingUnfixId);
    if (!existing) return showAlert('Unfix Invoice not found.');
    const alreadyOrdered = getUnfixReservedOrderQty(existing);
    if (qty + 1e-9 < alreadyOrdered) return showAlert('Invoice Qty cannot be less than the quantity already ordered (' + alreadyOrdered + ').');
    if (alreadyOrdered > 0 && (existing.party !== party || existing.product !== product || existing.type !== document.getElementById('uf_type').value)) {
      return showAlert('Party, Product and Sale/Purchase type cannot be changed after orders are linked.');
    }
    existing.trackingNo=existing.trackingNo||('TRK-'+String(existing.id).replace(/[^A-Za-z0-9-]/g,''));
    existing.date = date;
    existing.type = document.getElementById('uf_type').value;
    existing.party = party;
    existing.product = product;
    existing.qty = qty;
    existing.provisionalRate = rate;
    existing.narration = document.getElementById('uf_narr').value;
    if (!existing.status) existing.status = db.currentUser?.role === 'Admin' ? 'Approved' : 'Pending';
    showAlert('✓ Unfix Invoice [' + editingUnfixId + '] updated successfully!');
    editingUnfixId = null;
  } else {
    db.unfixInvoices.push({
      id: document.getElementById('uf_no').value,
      trackingNo: 'TRK-'+String(document.getElementById('uf_no').value||'UF').replace(/[^A-Za-z0-9-]/g,''),
      date, type: document.getElementById('uf_type').value,
      party, product, qty, provisionalRate: rate,
      narration: document.getElementById('uf_narr').value,
      ordersAgainst: [],
      status: db.currentUser?.role === 'Admin' ? 'Approved' : 'Pending',
      by: db.currentUser?.username || ''
    });
    showAlert('✓ Unfix Invoice saved successfully!');
  }
  saveDb();
  renderUnfix();
}
function updateUnfixOrderFields() {
  const id = document.getElementById('ufo_inv')?.value;
  const inv = (db.unfixInvoices || []).find(u => u.id === id);
  const fixed = inv ? getUnfixReservedOrderQty(inv) : 0;
  const pending = inv ? Math.max(0, Number(inv.qty || 0) - fixed) : 0;
  const product = inv ? (db.products || []).find(p => p.name === inv.product) : null;
  const set = (id, value) => { const el = document.getElementById(id); if (el) el.value = value ?? ''; };
  set('ufo_product', inv?.product || '');
  set('ufo_unit', product?.unit || '');
  set('ufo_pending', inv ? pending : '');
  const qty = document.getElementById('ufo_qty');
  if (qty) qty.max = pending;
}
function saveOrderAgainstUnfix() {
  const inv = (db.unfixInvoices || []).find(u => u.id === document.getElementById('ufo_inv')?.value);
  if (!inv) return showAlert('Select Unfix Invoice.');
  const fixed = getUnfixReservedOrderQty(inv);
  const pending = Number(inv.qty || 0) - fixed;
  const q = parseIndianNumber(document.getElementById('ufo_qty')?.value || 0);
  const r = parseIndianNumber(document.getElementById('ufo_rate')?.value || 0);
  const dt = document.getElementById('ufo_date')?.value;
  if (!dt) return showAlert('Select Order Date.');
  if (!(q > 0) || q > pending + 1e-9) return showAlert('Order Qty must be greater than zero and cannot exceed invoice pending qty (' + pending + ').');
  if (!(r > 0)) return showAlert('Enter a valid Order Rate greater than zero.');
  if (!Array.isArray(inv.ordersAgainst)) inv.ordersAgainst = [];
  const product = inv.product;
  const pr = (db.products || []).find(p => p.name === product);
  const orderId = 'UO-' + Date.now().toString(36).toUpperCase();
  inv.ordersAgainst.push({
    id: orderId, orderId, date: dt, product, unit: pr?.unit || '',
    pendingAtOrder: pending, qty: q, rate: r, fixedRate: r, value: q * r,
    deliveredQty: 0, deliveries: [], status: db.currentUser?.role === 'Admin' ? 'Approved' : 'Pending',
    by: db.currentUser?.username || ''
  });
  saveDb();
  renderUnfix();
  showAlert('Order ' + orderId + ' saved. ' + (db.currentUser?.role === 'Admin' ? 'Approved' : 'Pending Admin Approval') + '.');
}

        </div>

      ${doc.totalAmount || doc.totalValue || doc.amount ? `

  `;

function promptCommitBatchApprovals() {
  const pV = (db.vouchers || []).filter(v => v.status === 'Pending');
  const pO = (db.orders || []).filter(o => o.status === 'Pending');
  const pU = (db.unfixInvoices || []).filter(u => u.status === 'Pending');
  const pUA = (db.unfixInvoices || []).flatMap(inv => (inv.ordersAgainst || []).filter(o => o.status === 'Pending'));
  const total = pV.length + pO.length + pU.length + pUA.length;
  if (total === 0) return showAlert('No pending entries to authorize.');

  promptAdminAuth('Authorize & Commit Entries to Inventory', () => {
    performCommitBatchApprovals();
  });
}

function performCommitBatchApprovals() {
  let approvedCount = 0;
  let rejectedCount = 0;

  (db.vouchers || []).forEach(v => {
    if (v.status === 'Pending') {
      const radio = document.querySelector(`input[name="act_${v.id}"]:checked`);
      const decision = radio ? radio.value : 'Accept';
      if (decision === 'Accept') {
        v.status = 'Approved';
        approvedCount++;
      } else {
        v.status = 'Rejected';
        rejectedCount++;
      }
    }
  });

  (db.orders || []).forEach(o => {
    if (o.status === 'Pending') {
      const radio = document.querySelector(`input[name="act_${o.id}"]:checked`);
      const decision = radio ? radio.value : 'Accept';
      if (decision === 'Accept') {
        o.status = 'Approved';
        approvedCount++;
      } else {
        o.status = 'Rejected';
        rejectedCount++;
      }
    }
  });

  (db.unfixInvoices || []).forEach(u => {
    if (u.status === 'Pending') {
      const radio = document.querySelector(`input[name="act_${u.id}"]:checked`);
      const decision = radio ? radio.value : 'Accept';
      if (decision === 'Accept') {
        u.status = 'Approved';
        approvedCount++;
      } else {
        u.status = 'Rejected';
        rejectedCount++;
      }
    }
  });

  (db.unfixInvoices || []).forEach(inv => {
    (inv.ordersAgainst || []).forEach(o => {
      if (o.status !== 'Pending') return;
      const orderKey = o.id || o.orderId;
      const radio = document.querySelector(`input[name="act_${orderKey}"]:checked`);
      const decision = radio ? radio.value : 'Accept';
      o.status = decision === 'Accept' ? 'Approved' : 'Rejected';
      if (decision === 'Accept') approvedCount++;
      else rejectedCount++;
    });
  });

  saveDb();
  updateHeaderControls();
  renderApprovals();
  showAlert(`✓ Batch Authorization Complete!\n${approvedCount} entries APPROVED and committed to inventory stock & balances.\n${rejectedCount} entries rejected.`);
}

function saveUser() {
  const username = document.getElementById('usr_u')?.value.trim();
  const name = document.getElementById('usr_n')?.value.trim();
  const password = document.getElementById('usr_p')?.value;
  const confirmPassword = document.getElementById('usr_cp')?.value;
  const role = document.getElementById('usr_r')?.value || 'User';
  const menuPermissions = role === 'Admin' ? ERP_MENU_PERMISSIONS.map(x => x[0]) : collectUserMenuPermissions();

  if (!username || !name) return showAlert('Username and Name are required.');
  if (!password) return showAlert('Password is required.');
  if (password !== confirmPassword) {
    return showAlert('Passwords do not match! Please check Password and Confirm Password.');
  }

  const existingIdx = db.users.findIndex(u => u.username.toLowerCase() === username.toLowerCase());
  if (existingIdx !== -1) {
    db.users[existingIdx].name = name;
    db.users[existingIdx].password = password;
    db.users[existingIdx].role = role;
    db.users[existingIdx].menuPermissions = menuPermissions;
    showAlert('✓ User [' + username + '] updated successfully!');
  } else {
    db.users.push({ username, name, password, role, menuPermissions });
    showAlert('✓ User [' + username + '] created successfully!');
  }
  saveDb();
  updateHeaderControls();
  if (currentView === 'settings' && ['useranddata','data'].includes(currentSub)) renderUserAndDataTab(); else if ((currentView === 'transaction' || currentView === 'settings') && ['useranddata','data'].includes(currentSub)) renderUserAndDataTab(); else renderUsers();
}

function modifyUser(uname) {
  const u = db.users.find(x => x.username === uname);
  if (!u) return showAlert('User not found.');
  document.getElementById('usr_u').value = u.username;
  document.getElementById('usr_u').readOnly = true;
  document.getElementById('usr_n').value = u.name;
  document.getElementById('usr_p').value = u.password;
  document.getElementById('usr_cp').value = u.password;
  document.getElementById('usr_r').value = u.role;
  document.querySelectorAll('.user-menu-permission').forEach(el => el.checked = u.role === 'Admin' || (Array.isArray(u.menuPermissions) && u.menuPermissions.includes(el.value)));
  document.getElementById('usr_form_title').textContent = 'Modify User: ' + u.username;
  document.getElementById('btn_save_user').textContent = 'Update User';
}

function deleteUser(uname) {
  if (uname === 'admin' || (db.currentUser && uname === db.currentUser.username)) {
    return showAlert('Cannot delete the primary admin or currently active user.');
  }
  db.users = db.users.filter(u => u.username !== uname);
  saveDb();
  updateHeaderControls();
  renderUsers();
  showAlert('✓ User [' + uname + '] deleted successfully.');
}

<script>

/* Custom dropdown interaction layer.
   The original select remains the source of truth for value, form submission and existing onchange handlers. */
(function () {
  'use strict';
  if (window.__sriramCustomDropdownInstalled) return;
  window.__sriramCustomDropdownInstalled = true;

  var active = null;
  var valueDescriptor = Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, 'value');
  var indexDescriptor = Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, 'selectedIndex');

  function eligible(select) {
    return select instanceof HTMLSelectElement &&
      select.id !== 'login_fy' &&
      !select.multiple &&
      !(select.size > 1) &&
      !select.dataset.erpCustomDropdown;
  }

  function optionLabel(option) {
    return (option && (option.label || option.textContent) || '').trim();
  }

  function selectedText(select) {
    var option = select.options[select.selectedIndex];
    return option ? optionLabel(option) : (select.getAttribute('data-placeholder') || 'Select...');
  }

  function wrapperWidth(select, wrap) {
    var inlineWidth = (select.getAttribute('style') || '').match(/(?:^|;)\s*width\s*:\s*([^;]+)/i);
    if (inlineWidth && inlineWidth[1].trim().includes('%')) {
      wrap.style.width = inlineWidth[1].trim();
      return;
    }
    var rect = select.getBoundingClientRect();
    var cs = getComputedStyle(select);
    if (cs.display === 'block' || cs.width === '100%') {
      wrap.style.width = '100%';
    } else {
      wrap.style.width = Math.max(90, rect.width || parseFloat(cs.width) || 160) + 'px';
    }
    if (cs.flex && cs.flex !== '0 1 auto') wrap.style.flex = cs.flex;
    if (cs.maxWidth && cs.maxWidth !== 'none') wrap.style.maxWidth = cs.maxWidth;
    if (cs.minWidth && cs.minWidth !== 'auto') wrap.style.minWidth = cs.minWidth;
  }

  function sync(select) {
    var wrap = select && select._erpCustomWrap;
    if (!wrap) return;
    var trigger = wrap.querySelector('.erp-select-trigger');
    var value = wrap.querySelector('.erp-select-value');
    if (value) value.textContent = selectedText(select);
    if (trigger) {
      trigger.disabled = !!select.disabled;
      trigger.setAttribute('aria-disabled', select.disabled ? 'true' : 'false');
      trigger.setAttribute('aria-expanded', active && active.select === select ? 'true' : 'false');
    }
    if (active && active.select === select) buildOptions(active.menu, select);
  }

  function closeMenu(returnFocus) {
    if (!active) return;
    var old = active;
    active = null;
    old.wrap.classList.remove('is-open');
    old.trigger.setAttribute('aria-expanded', 'false');
    if (old.menu && old.menu.parentNode) old.menu.parentNode.removeChild(old.menu);
    if (returnFocus && old.trigger.isConnected) old.trigger.focus();
  }

  function placeMenu(menu, trigger) {
    var rect = trigger.getBoundingClientRect();
    var gap = 4;
    var maxHeight = Math.min(300, Math.max(120, window.innerHeight - 24));
    menu.style.width = Math.max(rect.width, 140) + 'px';
    menu.style.maxHeight = maxHeight + 'px';
    menu.style.visibility = 'hidden';
    menu.style.left = Math.max(8, Math.min(rect.left, window.innerWidth - Math.max(rect.width, 140) - 8)) + 'px';
    menu.style.top = '8px';
    var menuHeight = Math.min(menu.scrollHeight || maxHeight, maxHeight);
    var below = window.innerHeight - rect.bottom - gap;
    var above = rect.top - gap;
    var top;
    if (below >= Math.min(menuHeight, 150) || below >= above) {
      top = rect.bottom + gap;
      menu.style.maxHeight = Math.max(100, Math.min(maxHeight, below - 8)) + 'px';
    } else {
      menu.style.maxHeight = Math.max(100, Math.min(maxHeight, above - 8)) + 'px';
      menuHeight = Math.min(menu.scrollHeight || menuHeight, parseFloat(menu.style.maxHeight));
      top = Math.max(8, rect.top - gap - menuHeight);
    }
    menu.style.top = top + 'px';
    menu.style.visibility = 'visible';
  }

  function buildOptions(menu, select) {
    menu.textContent = '';
    Array.prototype.forEach.call(select.options, function (option, index) {
      var item = document.createElement('button');
      item.type = 'button';
      item.className = 'erp-select-option';
      item.textContent = optionLabel(option) || '\\u00a0';
      item.disabled = !!option.disabled || !!(option.parentElement && option.parentElement.disabled);
      item.setAttribute('role', 'option');
      item.setAttribute('aria-selected', index === select.selectedIndex ? 'true' : 'false');
      if (index === select.selectedIndex) item.classList.add('is-selected');
      item.dataset.optionIndex = String(index);
      item.addEventListener('mouseenter', function () {
        menu.querySelectorAll('.erp-select-option.is-active').forEach(function (node) {
          node.classList.remove('is-active');
        });
        item.classList.add('is-active');
      });
      item.addEventListener('click', function () {
        if (item.disabled) return;
        select.selectedIndex = index;
        if (valueDescriptor && valueDescriptor.get.call(select) !== option.value) {
          valueDescriptor.set.call(select, option.value);
        }
        select.dispatchEvent(new Event('input', { bubbles: true }));
        select.dispatchEvent(new Event('change', { bubbles: true }));
        sync(select);
        closeMenu(false);
        var trigger = select._erpCustomWrap.querySelector('.erp-select-trigger');
        if (trigger) trigger.focus();
      });
      menu.appendChild(item);
    });
  }

  function openMenu(select, focusSelected) {
    if (select.disabled) return;
    if (active && active.select === select) {
      closeMenu(false);
      return;
    }
    closeMenu(false);
    var wrap = select._erpCustomWrap;
    var trigger = wrap.querySelector('.erp-select-trigger');
    var menu = document.createElement('div');
    menu.className = 'erp-select-menu';
    menu.setAttribute('role', 'listbox');
    menu.setAttribute('aria-label', select.getAttribute('aria-label') || select.name || select.id || 'Options');
    buildOptions(menu, select);
    document.body.appendChild(menu);
    active = { select: select, wrap: wrap, trigger: trigger, menu: menu };
    wrap.classList.add('is-open');
    trigger.setAttribute('aria-expanded', 'true');
    placeMenu(menu, trigger);
    var items = menu.querySelectorAll('.erp-select-option:not(:disabled)');
    var target = focusSelected ? menu.querySelector('.erp-select-option.is-selected:not(:disabled)') : null;
    if (!target) target = items[0];
    if (target) {
      target.classList.add('is-active');
      target.scrollIntoView({ block: 'nearest' });
    }
  }

  function attach(select) {
    if (!eligible(select)) return;
    var parent = select.parentNode;
    if (!parent) return;
    var rect = select.getBoundingClientRect();
    var cs = getComputedStyle(select);
    var wrap = document.createElement('span');
    wrap.className = 'erp-select-wrap';
    wrapperWidth(select, wrap);
    wrap.style.font = cs.font;
    wrap.style.lineHeight = cs.lineHeight;
    wrap.style.margin = cs.margin;
    wrap.style.verticalAlign = cs.verticalAlign;
    parent.insertBefore(wrap, select);
    wrap.appendChild(select);
    select.classList.add('erp-select-proxy');
    select.dataset.erpCustomDropdown = '1';
    select._erpCustomWrap = wrap;

    var trigger = document.createElement('button');
    trigger.type = 'button';
    trigger.className = 'erp-select-trigger';
    trigger.setAttribute('aria-haspopup', 'listbox');
    trigger.setAttribute('aria-expanded', 'false');
    trigger.setAttribute('aria-label', select.getAttribute('aria-label') || select.name || select.id || 'Open dropdown');
    var value = document.createElement('span');
    value.className = 'erp-select-value';
    value.textContent = selectedText(select);
    var chevron = document.createElement('span');
    chevron.className = 'erp-select-chevron';
    chevron.setAttribute('aria-hidden', 'true');
    trigger.appendChild(value);
    trigger.appendChild(chevron);
    wrap.appendChild(trigger);

    trigger.addEventListener('click', function () { openMenu(select, false); });
    trigger.addEventListener('keydown', function (event) {
      var menu, items, current, index;
      if (event.key === 'ArrowDown' || event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        if (!active || active.select !== select) openMenu(select, true);
        else {
          menu = active.menu;
          items = Array.from(menu.querySelectorAll('.erp-select-option:not(:disabled)'));
          current = menu.querySelector('.erp-select-option.is-active');
          index = items.indexOf(current);
          if (items.length) {
            if (event.key === 'ArrowDown') index = Math.min(items.length - 1, index + 1);
            else if (event.key === 'Enter' || event.key === ' ') {
              if (current) current.click();
              return;
            }
            items.forEach(function (item) { item.classList.toggle('is-active', items.indexOf(item) === index); });
            items[index].scrollIntoView({ block: 'nearest' });
          }
        }
      } else if (event.key === 'Escape' && active && active.select === select) {
        event.preventDefault(); closeMenu(false);
      } else if (event.key === 'ArrowUp' && active && active.select === select) {
        event.preventDefault();
        items = Array.from(active.menu.querySelectorAll('.erp-select-option:not(:disabled)'));
        current = active.menu.querySelector('.erp-select-option.is-active');
        index = items.indexOf(current);
        index = Math.max(0, index - 1);
        items.forEach(function (item) { item.classList.toggle('is-active', items.indexOf(item) === index); });
        if (items[index]) items[index].scrollIntoView({ block: 'nearest' });
      }
    });

    select.addEventListener('change', function () { sync(select); });
    select.addEventListener('input', function () { sync(select); });

    if (valueDescriptor && valueDescriptor.get && valueDescriptor.set) {
      try {
        Object.defineProperty(select, 'value', {
          configurable: true,
          enumerable: true,
          get: function () { return valueDescriptor.get.call(this); },
          set: function (next) {
            valueDescriptor.set.call(this, next);
            sync(this);
          }
        });
      } catch (e) {}
    }
    if (indexDescriptor && indexDescriptor.get && indexDescriptor.set) {
      try {
        Object.defineProperty(select, 'selectedIndex', {
          configurable: true,
          enumerable: true,
          get: function () { return indexDescriptor.get.call(this); },
          set: function (next) {
            indexDescriptor.set.call(this, next);
            sync(this);
          }
        });
      } catch (e) {}
    }

  }

  function scan(root) {
    if (!root) return;
    if (root.matches && root.matches('select')) attach(root);
    if (root.querySelectorAll) root.querySelectorAll('select').forEach(attach);
  }

  document.addEventListener('click', function (event) {
    if (!active) return;
    if (active.menu.contains(event.target) || active.wrap.contains(event.target)) return;
    closeMenu(false);
  }, true);

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && active) closeMenu(true);
  });

  window.addEventListener('resize', function () {
    if (active) placeMenu(active.menu, active.trigger);
  });
  window.addEventListener('scroll', function () {
    if (active) placeMenu(active.menu, active.trigger);
  }, true);

  scan(document.body);
  var observer = new MutationObserver(function (records) {
    records.forEach(function (record) {
      if (record.type === 'childList') {
        record.addedNodes.forEach(function (node) {
          if (node.nodeType === 1) scan(node);
        });
        if (record.target instanceof HTMLSelectElement && record.target._erpCustomWrap) {
          sync(record.target);
        }
      }
    });
  });
  observer.observe(document.body, { childList: true, subtree: true });
})();

</script>
